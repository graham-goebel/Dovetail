function Thread(props) {

function Page() {
  const [retries, setRetries] = React.useState(0);
  const failedStatus = retries ? "sending" : "failed";
  return h(Shelf, { name: "MessageBubble", summary: "One message. Sent sits right in the action colours, received left in a quiet surface; runs from one author tighten where they meet. Time, delivery status and group authors are props.", props: [
      { name: "from", type: '"me" | "them"', required: true, notes: "Alignment and colours." },
      { name: "children", type: "ReactNode", notes: "The message. Newlines are kept; long words and URLs wrap." },
      { name: "time", type: "string", notes: "Preformatted, e.g. 9:41. Shown under the bubble." },
      { name: "status", type: '"sending" | "sent" | "delivered" | "read" | "failed"', notes: "Sent messages only. Icon plus a text alternative; failed shows Not sent." },
      { name: "onRetry", type: "() => void", notes: "With failed, shows a Retry button." },
      { name: "author", type: "{ name: string; src?: string }", notes: "Received messages in a group: avatar beside the first bubble of a run, name above it." },
      { name: "grouped", type: '"first" | "middle" | "last" | "single"', default: '"single"', notes: "Position in a run from one author." },
    ], guidance: [
      "Work out grouped in your app from consecutive messages by the same author, usually within a few minutes of each other.",
      "Show time and status on the last bubble of a run, not on every one.",
      "Status is only for your own messages. A received message has no delivery state to show.",
      "Only pass author in group conversations. In a one-to-one chat the header already says who it is.",
      "Failed messages must offer Retry, or say what happens next. Never drop a message silently.",
    ] },
    h(Specimen, { label: "Sent and received", bg: "var(--dt-surface-base)" },
      h(Thread, null,
        h(DS.MessageBubble, { from: "them", time: "9:38" }, "Morning! Are we still on for the site visit at 11?"),
        h(DS.MessageBubble, { from: "me", time: "9:39", status: "read" }, "Yes, I'll meet you at the gate."))),
    h(Specimen, { label: "Runs: first, middle, last", bg: "var(--dt-surface-base)" },
      h(Thread, null,
        h(DS.MessageBubble, { from: "them", grouped: "first" }, "Three things before Friday:"),
        h(DS.MessageBubble, { from: "them", grouped: "middle" }, "the signed quote,"),
        h(DS.MessageBubble, { from: "them", grouped: "middle" }, "the floor plan,"),
        h(DS.MessageBubble, { from: "them", grouped: "last", time: "10:02" }, "and a date for the survey."),
        h(DS.MessageBubble, { from: "me", grouped: "first" }, "Quote's attached."),
        h(DS.MessageBubble, { from: "me", grouped: "middle" }, "Floor plan by tonight."),
        h(DS.MessageBubble, { from: "me", grouped: "last", time: "10:04", status: "delivered" }, "Survey: any day next week?"))),
    h(Specimen, { label: "Every status", bg: "var(--dt-surface-base)" },
      h(Thread, null,
        h(DS.MessageBubble, { from: "me", time: "10:10", status: "sending" }, "Sending"),
        h(DS.MessageBubble, { from: "me", time: "10:10", status: "sent" }, "Sent"),
        h(DS.MessageBubble, { from: "me", time: "10:10", status: "delivered" }, "Delivered"),
        h(DS.MessageBubble, { from: "me", time: "10:11", status: "read" }, "Read"),
        h(DS.MessageBubble, { from: "me", time: "10:12", status: failedStatus, onRetry: () => setRetries(retries + 1) }, retries ? "Retrying: the app set status back to sending" : "Failed, with Retry"))),
    h(Specimen, { label: "Group chat authors", bg: "var(--dt-surface-base)" },
      h(Thread, null,
        h(DS.MessageBubble, { from: "them", author: { name: "Maya Chen" }, grouped: "first" }, "Draft's in the shared folder."),
        h(DS.MessageBubble, { from: "them", author: { name: "Maya Chen" }, grouped: "last", time: "14:20" }, "Comments by Thursday, please."),
        h(DS.MessageBubble, { from: "them", author: { name: "Theo Okafor" }, time: "14:22" }, "On it."),
        h(DS.MessageBubble, { from: "me", time: "14:23", status: "read" }, "Same. Thanks, Maya."))),
    h(Specimen, { label: "Long text, a long URL, line breaks", bg: "var(--dt-surface-base)" },
      h(Thread, null,
        h(DS.MessageBubble, { from: "them", time: "15:01" }, "The survey takes about two hours. The surveyor needs access to every room, the loft if there is one, and the meter cupboard, so please move anything that blocks them the evening before. They'll email the report within three working days."),
        h(DS.MessageBubble, { from: "me", time: "15:03", status: "delivered" }, "Here's the listing: https://example.com/properties/northwind-house/floor-plans/ground-floor-revised-final-v3.pdf?utm_source=chat&utm_medium=message"),
        h(DS.MessageBubble, { from: "them", time: "15:04" }, "Checklist:\n1. Keys\n2. Meter readings\n3. Parking permit"))),
    h(DarkBand, null,
      h(Thread, null,
        h(DS.MessageBubble, { from: "them", author: { name: "Maya Chen" }, grouped: "first" }, "Draft's in the shared folder."),
        h(DS.MessageBubble, { from: "them", author: { name: "Maya Chen" }, grouped: "last", time: "14:20" }, "Comments by Thursday, please."),
        h(DS.MessageBubble, { from: "me", grouped: "first" }, "Will do."),
        h(DS.MessageBubble, { from: "me", grouped: "last", time: "14:23", status: "read" }, "Reading it now."),
        h(DS.MessageBubble, { from: "me", time: "14:24", status: "failed", onRetry: () => {} }, "This one didn't send."))));
}

/* Self-contained bootstrap: render once the bundle and the card kit are
   loaded, or say on screen why not. */
(function () {
  var NEED = ["Section","Stack","Inline","IconButton","Avatar","Button","MessageBubble"];
  var NS_KEY = "BeamMobileDesignSystem_e33121";
  var TICK = 40, REFETCH_AT = 1200, DEADLINE = 8000;
  var startedAt = Date.now(), refetched = false;
  function missing() {
    var ns = window[NS_KEY];
    if (!ns) return NEED.slice();
    return NEED.filter(function (n) { return !ns[n]; });
  }
  function kitReady() { return !!(window.Shelf && window.Specimen); }
  function explain(gaps) {
    var el = document.getElementById("root");
    if (!el) return;
    var why = !window[NS_KEY] ? "<code>bundle.js</code> did not load." : !kitReady() ? "<code>card-kit.js</code> did not load." : "The loaded bundle is missing: <code>" + gaps.join(", ") + "</code>. A hard reload clears a cached copy.";
    el.innerHTML = '<div role="alert" style="max-width:64ch;margin:40px auto;padding:20px 24px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#3f3f46"><strong style="display:block;margin-bottom:6px;color:#18181b">This card could not load the design system</strong>' + why + "</div>";
  }
  (function poll() {
    var gaps = missing();
    if (gaps.length === 0 && kitReady()) {
      DS = window[NS_KEY];
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Page, null));
      return;
    }
    if (Date.now() - startedAt > REFETCH_AT && !refetched && gaps.length) {
      refetched = true;
      var base = document.querySelector('script[src*="components/bundle.js"]');
      if (base) { var s = document.createElement("script"); s.src = base.getAttribute("src").split("?")[0] + "?cb=" + Date.now(); document.head.appendChild(s); }
    }
    if (Date.now() - startedAt > DEADLINE) return explain(gaps);
    setTimeout(poll, TICK);
  })();
})();
