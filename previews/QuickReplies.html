/* Self-contained bootstrap: render once the bundle and the card kit are

(function () {

  var NS_KEY = "BeamMobileDesignSystem_e33121";

  var startedAt = Date.now(), refetched = false;
  function missing() {
    var ns = window[NS_KEY];
    if (!ns) return NEED.slice();
    return NEED.filter(function (n) { return !ns[n]; });
  }
  function kitReady() { return !!(window.Shelf && window.Specimen); }
  function explain(gaps) {
    var el = document.getElementById("root");
    if (!el) return;
    var why = !window[NS_KEY] ? "<code>bundle.js</code> did not load." : !kitReady() ? "<code>card-kit.js</code> did not load." : "The loaded bundle is missing: <code>" + gaps.join(", ") + "</code>. A hard reload clears a cached copy.";
    el.innerHTML = '<div role="alert" style="max-width:64ch;margin:40px auto;padding:20px 24px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#3f3f46"><strong style="display:block;margin-bottom:6px;color:#18181b">This card could not load the design system</strong>' + why + "</div>";
  }

    var gaps = missing();
    if (gaps.length === 0 && kitReady()) {
      DS = window[NS_KEY];
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Page, null));
      return;
    }
    if (Date.now() - startedAt > REFETCH_AT && !refetched && gaps.length) {
      refetched = true;
      var base = document.querySelector('script[src*="components/bundle.js"]');
      if (base) { var s = document.createElement("script"); s.src = base.getAttribute("src").split("?")[0] + "?cb=" + Date.now(); document.head.appendChild(s); }
    }
    if (Date.now() - startedAt > DEADLINE) return explain(gaps);
    setTimeout(poll, TICK);
  })();
})();
