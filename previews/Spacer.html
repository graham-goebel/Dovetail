/* TIER 1 — PRIMITIVE COLOR

   Never reference these from a component. Semantic tokens are the only legal consumer.

   as the same visual weight, so swapping a brand hue keeps contrast predictable. */

  --dt-color-black: oklch(0 0 0);
  --dt-color-transparent: oklch(0 0 0 / 0);

  --dt-color-neutral-500: oklch(0.556 0.008 264);
  --dt-color-neutral-600: oklch(0.440 0.008 264);

  --dt-color-neutral-950: oklch(0.145 0.005 264);

  /* Primary — the default brand hue. A theme replaces this ramp wholesale. */

  --dt-color-primary-100: oklch(0.936 0.032 259);

  --dt-color-primary-800: oklch(0.404 0.162 259);
  --dt-color-primary-900: oklch(0.344 0.128 259);
  --dt-color-primary-950: oklch(0.256 0.093 259);

  /* Green */
  --dt-color-green-050: oklch(0.972 0.021 150);

/* TIER 1 — PRIMITIVE DIMENSION
   One base unit: 4px. Every value is a multiple, and the number in the name is the multiplier.
   --dt-dim-6 is 6 × 4px = 24px. The name stays true if the base unit ever changes.

   Sub-unit values exist only for hairlines and optical nudges. They are named separately
   so they cannot be mistaken for layout spacing. */

:root {
  --dt-dim-0: 0px;
  --dt-dim-1: 4px;
  --dt-dim-2: 8px;
  --dt-dim-3: 12px;
  --dt-dim-4: 16px;
  --dt-dim-5: 20px;
  --dt-dim-6: 24px;
  --dt-dim-7: 28px;
  --dt-dim-8: 32px;
  --dt-dim-9: 36px;
  --dt-dim-10: 40px;
  --dt-dim-11: 44px;
  --dt-dim-12: 48px;
  --dt-dim-14: 56px;
  --dt-dim-16: 64px;
  --dt-dim-20: 80px;
  --dt-dim-24: 96px;
  --dt-dim-28: 112px;
  --dt-dim-32: 128px;
  --dt-dim-40: 160px;
  --dt-dim-48: 192px;
  --dt-dim-56: 224px;
  --dt-dim-64: 256px;

  /* Sub-unit. Hairlines and optical corrections only — never layout. */
  --dt-dim-hair: 1px;
  --dt-dim-hair-2: 2px;

  /* Raw radii */
  --dt-radius-raw-0: 0px;
  --dt-radius-raw-2: 2px;
  --dt-radius-raw-4: 4px;
  --dt-radius-raw-6: 6px;
  --dt-radius-raw-8: 8px;
  --dt-radius-raw-12: 12px;
  --dt-radius-raw-16: 16px;
  --dt-radius-raw-24: 24px;
  --dt-radius-raw-full: 9999px;

  /* Container widths */
  --dt-dim-container-sm: 640px;
  --dt-dim-container-md: 768px;
  --dt-dim-container-lg: 1024px;
  --dt-dim-container-xl: 1280px;
  --dt-dim-container-2xl: 1536px;

  /* Breakpoints, mirrored here so they can be documented as tokens.
     Media queries cannot read custom properties — the values are duplicated
     in guidelines/layout.md and must be changed in both places. */
  --dt-breakpoint-sm: 640px;
  --dt-breakpoint-md: 768px;
  --dt-breakpoint-lg: 1024px;
  --dt-breakpoint-xl: 1280px;
  --dt-breakpoint-2xl: 1536px;
}

/* TIER 1 — PRIMITIVE TYPOGRAPHY
   Font sizes follow a 1.200 modular scale from a 16px base, rounded to whole pixels.
   Two rounds are deliberate and documented: 13.33 → 14 and 57.33 → 58, because 14px is
   the workhorse UI size and a half-pixel display size renders inconsistently.

   Line heights snap to the 4px grid so text blocks align with everything else.
   This is the one place the modular scale and the 4px grid are reconciled by hand. */

@import url("https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap");

:root {
  /* Families. A theme overrides these three lines and nothing else. */
  --dt-font-family-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --dt-font-family-serif: ui-serif, Georgia, "Times New Roman", serif;
  --dt-font-family-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Size ramp */
  --dt-font-size-2xs: 11px;
  --dt-font-size-xs: 12px;
  --dt-font-size-sm: 14px;
  --dt-font-size-md: 16px;
  --dt-font-size-lg: 19px;
  --dt-font-size-xl: 23px;
  --dt-font-size-2xl: 28px;
  --dt-font-size-3xl: 33px;
  --dt-font-size-4xl: 40px;
  --dt-font-size-5xl: 48px;
  --dt-font-size-6xl: 58px;
  --dt-font-size-7xl: 69px;

  /* Line heights — all multiples of 4 */
  --dt-line-height-2xs: 16px;
  --dt-line-height-xs: 16px;
  --dt-line-height-sm: 20px;
  --dt-line-height-md: 24px;
  --dt-line-height-lg: 28px;
  --dt-line-height-xl: 32px;
  --dt-line-height-2xl: 36px;
  --dt-line-height-3xl: 40px;
  --dt-line-height-4xl: 48px;
  --dt-line-height-5xl: 52px;
  --dt-line-height-6xl: 64px;
  --dt-line-height-7xl: 76px;

  /* Weights */
  --dt-font-weight-light: 300;
  --dt-font-weight-regular: 400;
  --dt-font-weight-medium: 500;
  --dt-font-weight-semibold: 600;
  --dt-font-weight-bold: 700;
  --dt-font-weight-extrabold: 800;

  /* Tracking. Large type needs negative tracking; small type needs positive. */
  --dt-tracking-tighter: -0.03em;
  --dt-tracking-tight: -0.02em;
  --dt-tracking-snug: -0.01em;
  --dt-tracking-normal: 0em;
  --dt-tracking-wide: 0.02em;
  --dt-tracking-wider: 0.06em;

  /* Measure — characters per line, for readable prose */
  --dt-measure-narrow: 45ch;
  --dt-measure-default: 68ch;
  --dt-measure-wide: 85ch;
}

/* TIER 1 — PRIMITIVE MOTION
   Raw durations and easing curves. Components reference the semantic motion roles,
   not these. Durations are short by default: interface motion confirms a change,
   it does not perform. */

:root {
  --dt-duration-instant: 0ms; /* @kind other */
  --dt-duration-50: 50ms; /* @kind other */
  --dt-duration-100: 100ms; /* @kind other */
  --dt-duration-150: 150ms; /* @kind other */
  --dt-duration-200: 200ms; /* @kind other */
  --dt-duration-300: 300ms; /* @kind other */
  --dt-duration-400: 400ms; /* @kind other */
  --dt-duration-600: 600ms; /* @kind other */

  --dt-easing-linear: linear; /* @kind other */
  --dt-easing-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */
  --dt-easing-decelerate: cubic-bezier(0, 0, 0, 1); /* @kind other */
  --dt-easing-accelerate: cubic-bezier(0.3, 0, 1, 1); /* @kind other */
  --dt-easing-emphasis: cubic-bezier(0.2, 0, 0, 1.2); /* @kind other */
}

/* TIER 1 — PRIMITIVE ELEVATION
   Raw shadow recipes. Each is a two-layer shadow: a tight contact shadow plus a
   soft ambient one. Single-layer shadows read as flat stickers at larger sizes. */

:root {
  --dt-shadow-raw-none: none; /* @kind other */
  --dt-shadow-raw-1: 0 1px 2px 0 oklch(0.145 0.005 264 / 0.06), 0 1px 3px 0 oklch(0.145 0.005 264 / 0.08); /* @kind other */
  --dt-shadow-raw-2: 0 1px 2px 0 oklch(0.145 0.005 264 / 0.06), 0 2px 6px -1px oklch(0.145 0.005 264 / 0.10); /* @kind other */
  --dt-shadow-raw-3: 0 2px 4px -1px oklch(0.145 0.005 264 / 0.06), 0 6px 12px -2px oklch(0.145 0.005 264 / 0.10); /* @kind other */
  --dt-shadow-raw-4: 0 4px 8px -2px oklch(0.145 0.005 264 / 0.06), 0 12px 24px -4px oklch(0.145 0.005 264 / 0.12); /* @kind other */
  --dt-shadow-raw-5: 0 8px 16px -4px oklch(0.145 0.005 264 / 0.08), 0 24px 48px -8px oklch(0.145 0.005 264 / 0.16); /* @kind other */
  --dt-shadow-raw-inset: inset 0 1px 2px 0 oklch(0.145 0.005 264 / 0.08); /* @kind other */
}


/* TIER 2 — SEMANTIC COLOR
   Purpose, not value. This is the themeable layer: a brand theme overrides these
   names and every component follows. No value words are allowed here — the moment
   "blue" appears in a semantic name, it becomes a lie waiting for the next rebrand.

   Pairing convention: every role that can be a background has a matching
   on- foreground role, and the pair is contrast-checked together.
   Use them as a set. `--dt-surface-action` without `--dt-text-on-action` is a bug.

   Values below are the LIGHT theme. Dark lives in tokens/themes/base-dark.css and
   re-points these same names. */

:root {
  /* ---- Surfaces -------------------------------------------------- */
  --dt-surface-base: var(--dt-color-white);          /* the page */
  --dt-surface-subtle: var(--dt-color-neutral-050);  /* quiet section behind the page */
  --dt-surface-raised: var(--dt-color-white);        /* cards, anything with elevation */
  --dt-surface-sunken: var(--dt-color-neutral-100);  /* wells, code blocks, inset areas */
  --dt-surface-overlay: var(--dt-color-white);       /* dialogs, popovers, menus */
  --dt-surface-inverse: var(--dt-color-neutral-900); /* dark band on a light page */
  --dt-surface-disabled: var(--dt-color-neutral-100);
  --dt-surface-scrim: oklch(0.145 0.005 264 / 0.5);  /* behind a modal */

  /* ---- Text ------------------------------------------------------ */
  --dt-text-primary: var(--dt-color-neutral-900);
  --dt-text-secondary: var(--dt-color-neutral-600);
  --dt-text-tertiary: var(--dt-color-neutral-500);
  --dt-text-disabled: var(--dt-color-neutral-400);
  --dt-text-inverse: var(--dt-color-neutral-050);
  --dt-text-link: var(--dt-color-primary-700);
  --dt-text-link-hover: var(--dt-color-primary-800);
  --dt-text-link-visited: var(--dt-color-violet-700);

  /* ---- Borders --------------------------------------------------- */
  --dt-border-subtle: var(--dt-color-neutral-100);
  --dt-border-default: var(--dt-color-neutral-200);
  --dt-border-strong: var(--dt-color-neutral-400);
  --dt-border-inverse: var(--dt-color-neutral-700);
  --dt-border-disabled: var(--dt-color-neutral-200);

  /* ---- Actions --------------------------------------------------- */
  --dt-surface-action: var(--dt-color-primary-600);
  --dt-surface-action-hover: var(--dt-color-primary-700);
  --dt-surface-action-active: var(--dt-color-primary-800);
  --dt-text-on-action: var(--dt-color-white);

  --dt-surface-action-secondary: var(--dt-color-white);
  --dt-surface-action-secondary-hover: var(--dt-color-neutral-050);
  --dt-surface-action-secondary-active: var(--dt-color-neutral-100);
  --dt-text-on-action-secondary: var(--dt-color-neutral-900);
  --dt-border-action-secondary: var(--dt-color-neutral-200);

  --dt-surface-action-ghost: var(--dt-color-transparent);
  --dt-surface-action-ghost-hover: var(--dt-color-neutral-100);
  --dt-surface-action-ghost-active: var(--dt-color-neutral-200);
  --dt-text-on-action-ghost: var(--dt-color-neutral-900);

  --dt-surface-action-danger: var(--dt-color-red-600);
  --dt-surface-action-danger-hover: var(--dt-color-red-700);
  --dt-surface-action-danger-active: var(--dt-color-red-800);
  --dt-text-on-action-danger: var(--dt-color-white);

  --dt-surface-action-disabled: var(--dt-color-neutral-100);
  --dt-text-on-action-disabled: var(--dt-color-neutral-400);

  /* ---- Selection ------------------------------------------------- */
  --dt-surface-selected: var(--dt-color-primary-050);
  --dt-surface-selected-hover: var(--dt-color-primary-100);
  --dt-text-on-selected: var(--dt-color-primary-900);
  --dt-border-selected: var(--dt-color-primary-600);

  /* ---- Feedback -------------------------------------------------- */
  --dt-surface-success: var(--dt-color-green-600);
  --dt-surface-success-subtle: var(--dt-color-green-050);
  --dt-border-success: var(--dt-color-green-200);
  --dt-text-success: var(--dt-color-green-800);
  --dt-text-on-success: var(--dt-color-white);

  --dt-surface-warning: var(--dt-color-amber-500);
  --dt-surface-warning-subtle: var(--dt-color-amber-050);
  --dt-border-warning: var(--dt-color-amber-200);
  --dt-text-warning: var(--dt-color-amber-900);
  --dt-text-on-warning: var(--dt-color-neutral-950);

  --dt-surface-danger: var(--dt-color-red-600);
  --dt-surface-danger-subtle: var(--dt-color-red-050);
  --dt-border-danger: var(--dt-color-red-200);
  --dt-text-danger: var(--dt-color-red-800);
  --dt-text-on-danger: var(--dt-color-white);

  --dt-surface-info: var(--dt-color-cyan-600);
  --dt-surface-info-subtle: var(--dt-color-cyan-050);
  --dt-border-info: var(--dt-color-cyan-200);
  --dt-text-info: var(--dt-color-cyan-900);
  --dt-text-on-info: var(--dt-color-white);

  /* ---- Focus ----------------------------------------------------- */
  --dt-focus-ring-color: var(--dt-color-primary-600);
  --dt-focus-ring-offset-color: var(--dt-surface-base);

  /* ---- Data visualisation ---------------------------------------
     The documented exception to the no-primitives rule. Chart series need a
     palette with no semantic meaning, ordered for categorical distinctness. */
  --dt-viz-1: var(--dt-color-primary-600);
  --dt-viz-2: var(--dt-color-violet-500);
  --dt-viz-3: var(--dt-color-cyan-600);
  --dt-viz-4: var(--dt-color-amber-500);
  --dt-viz-5: var(--dt-color-green-600);
  --dt-viz-6: var(--dt-color-red-500);
}

/* TIER 2 — SEMANTIC SPACE
   Three axes, because "16px" does not say what the gap is for. Naming the axis makes
   layout intent readable in markup and lets a density theme retune one axis alone.

   inset  — padding inside a container
   stack  — vertical gap between blocks
   inline — horizontal gap between siblings */

:root {
  --dt-space-inset-2xs: var(--dt-dim-1);   /* 4  */
  --dt-space-inset-xs: var(--dt-dim-2);    /* 8  */
  --dt-space-inset-sm: var(--dt-dim-3);    /* 12 */
  --dt-space-inset-md: var(--dt-dim-4);    /* 16 */
  --dt-space-inset-lg: var(--dt-dim-6);    /* 24 */
  --dt-space-inset-xl: var(--dt-dim-8);    /* 32 */
  --dt-space-inset-2xl: var(--dt-dim-12);  /* 48 */

  --dt-space-stack-2xs: var(--dt-dim-1);
  --dt-space-stack-xs: var(--dt-dim-2);
  --dt-space-stack-sm: var(--dt-dim-3);
  --dt-space-stack-md: var(--dt-dim-4);
  --dt-space-stack-lg: var(--dt-dim-6);
  --dt-space-stack-xl: var(--dt-dim-10);
  --dt-space-stack-2xl: var(--dt-dim-16);

  --dt-space-inline-2xs: var(--dt-dim-1);
  --dt-space-inline-xs: var(--dt-dim-2);
  --dt-space-inline-sm: var(--dt-dim-3);
  --dt-space-inline-md: var(--dt-dim-4);
  --dt-space-inline-lg: var(--dt-dim-6);
  --dt-space-inline-xl: var(--dt-dim-8);
  --dt-space-inline-2xl: var(--dt-dim-12);

  /* Page-level rhythm */
  --dt-space-section: var(--dt-dim-24);      /* 96 — between major page sections */
  --dt-space-section-compact: var(--dt-dim-16);
  --dt-space-gutter: var(--dt-dim-6);        /* 24 — page edge padding */
  --dt-space-gutter-wide: var(--dt-dim-10);
}

/* TIER 2 — SEMANTIC TYPOGRAPHY
   Roles, not sizes. A component asks for "heading-md", never "23px", so a theme can
   retune the whole ladder — including family and weight — from one file.

   Each role ships four properties. Use all four together; taking the size and
   dropping the line-height is how vertical rhythm breaks.

   display — marketing and hero type. Rare in product UI.
   heading — document and section structure. Maps to h1–h6.
   body    — prose and long-form reading.
   label   — UI chrome: buttons, form labels, table headers, badges.
   code    — monospaced. */

:root {
  /* ---- Display ---------------------------------------------------- */
  --dt-text-display-lg-family: var(--dt-font-family-sans);
  --dt-text-display-lg-size: var(--dt-font-size-7xl);
  --dt-text-display-lg-line: var(--dt-line-height-7xl);
  --dt-text-display-lg-weight: var(--dt-font-weight-semibold);
  --dt-text-display-lg-tracking: var(--dt-tracking-tighter);

  --dt-text-display-md-family: var(--dt-font-family-sans);

/* TIER 2 — SEMANTIC SHAPE
   Radius roles are named by what they wrap, not by size, so a sharp-cornered theme
   can flatten the whole system by re-pointing five lines.

   --dt-radius-scale is the single dial: a theme that wants everything rounder
   overrides the roles, but a theme that only wants a nudge can retune from here. */

:root {
  --dt-radius-none: var(--dt-radius-raw-0);
  --dt-radius-control: var(--dt-radius-raw-6);   /* buttons, inputs, selects */
  --dt-radius-container: var(--dt-radius-raw-8); /* cards, panels, alerts */
  --dt-radius-overlay: var(--dt-radius-raw-12);  /* dialogs, popovers, drawers */
  --dt-radius-media: var(--dt-radius-raw-8);     /* images, video, avatars-as-squares */
  --dt-radius-pill: var(--dt-radius-raw-full);   /* badges, tags, avatars */

  --dt-border-width-none: 0px;
  --dt-border-width-default: var(--dt-dim-hair);
  --dt-border-width-strong: var(--dt-dim-hair-2);

  /* Focus ring geometry. The colour lives in semantic/color.css. */
  --dt-focus-ring-width: var(--dt-dim-hair-2);
  --dt-focus-ring-offset: var(--dt-dim-hair-2);
}

/* TIER 2 — SEMANTIC SIZE
   Control heights and icon sizes, all on the 4px grid. A density theme overrides
   the control heights and every form control resizes together.

   Touch targets: --dt-size-control-md (40px) is the smallest size allowed on a
   touch surface without a padded hit area. WCAG 2.2 sets the floor at 24px;
   40px is the size people can actually hit. */

:root {
  --dt-size-control-xs: var(--dt-dim-6);   /* 24 — dense tables, inline chips */
  --dt-size-control-sm: var(--dt-dim-8);   /* 32 — toolbars, compact forms */
  --dt-size-control-md: var(--dt-dim-10);  /* 40 — the default */
  --dt-size-control-lg: var(--dt-dim-12);  /* 48 — primary CTAs, touch-first */

  --dt-size-icon-xs: var(--dt-dim-3);      /* 12 */
  --dt-size-icon-sm: var(--dt-dim-4);      /* 16 */
  --dt-size-icon-md: var(--dt-dim-5);      /* 20 — the default */
  --dt-size-icon-lg: var(--dt-dim-6);      /* 24 */
  --dt-size-icon-xl: var(--dt-dim-8);      /* 32 */

  --dt-size-avatar-xs: var(--dt-dim-5);    /* 20 */
  --dt-size-avatar-sm: var(--dt-dim-6);    /* 24 */
  --dt-size-avatar-md: var(--dt-dim-8);    /* 32 */
  --dt-size-avatar-lg: var(--dt-dim-10);   /* 40 */
  --dt-size-avatar-xl: var(--dt-dim-16);   /* 64 */

  /* The minimum hit area for any interactive element on touch. */
  --dt-size-touch-target: var(--dt-dim-11); /* 44 */
}

/* TIER 2 — SEMANTIC ELEVATION
   Elevation is a z-order vocabulary, not a shadow menu. Pick the level that matches
   what the element is, and the shadow follows. Dark themes swap shadows for surface
   lightness, because shadows are close to invisible on a dark ground.

   0 flush with the page          3 sticky headers, dropdowns
   1 cards, resting surfaces      4 dialogs, drawers
   2 hovered cards, popovers      5 toasts, anything above a dialog */

:root {
  --dt-elevation-0: var(--dt-shadow-raw-none); /* @kind other */
  --dt-elevation-1: var(--dt-shadow-raw-1); /* @kind other */
  --dt-elevation-2: var(--dt-shadow-raw-2); /* @kind other */
  --dt-elevation-3: var(--dt-shadow-raw-3); /* @kind other */
  --dt-elevation-4: var(--dt-shadow-raw-4); /* @kind other */
  --dt-elevation-5: var(--dt-shadow-raw-5); /* @kind other */
  --dt-elevation-inset: var(--dt-shadow-raw-inset); /* @kind other */

  /* Stacking order. Keep every fixed-position layer on this ladder —
     hand-picked z-index values are how overlay bugs start. */
  --dt-z-base: 0; /* @kind other */
  --dt-z-raised: 10; /* @kind other */
  --dt-z-sticky: 100; /* @kind other */
  --dt-z-dropdown: 200; /* @kind other */
  --dt-z-overlay: 300; /* @kind other */
  --dt-z-dialog: 400; /* @kind other */
  --dt-z-toast: 500; /* @kind other */
  --dt-z-tooltip: 600; /* @kind other */
}

/* TIER 2 — SEMANTIC MOTION
   Four roles cover interface motion. Anything that needs a fifth is probably
   decoration, and decoration is not a system concern.

   micro    — state change on an element already on screen (hover, press, toggle)
   enter    — something arriving (popover opens, toast slides in)
   exit     — something leaving. Faster than enter: people wait for arrivals,
              they do not wait for departures.
   emphasis — a change that must be noticed (validation error, value update) */

:root {
  --dt-motion-micro: var(--dt-duration-100) var(--dt-easing-standard); /* @kind other */
  --dt-motion-enter: var(--dt-duration-200) var(--dt-easing-decelerate); /* @kind other */
  --dt-motion-exit: var(--dt-duration-150) var(--dt-easing-accelerate); /* @kind other */
  --dt-motion-emphasis: var(--dt-duration-300) var(--dt-easing-emphasis); /* @kind other */
}

/* Respect the user's setting. This is not optional. */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dt-motion-micro: var(--dt-duration-instant) var(--dt-easing-linear);
    --dt-motion-enter: var(--dt-duration-instant) var(--dt-easing-linear);
    --dt-motion-exit: var(--dt-duration-instant) var(--dt-easing-linear);
    --dt-motion-emphasis: var(--dt-duration-instant) var(--dt-easing-linear);
  }
}


/* BASE DARK THEME
   Dark mode is not a second design system. It re-points the same semantic names at
   different primitives. No component changes, no dark-specific class names.

   Two rules that make dark mode work:
   1. Elevation is expressed as surface LIGHTNESS, not shadow. Shadows are nearly
      invisible on a dark ground, so raised surfaces get lighter instead.
   2. Saturated fills step down one level. A 600-step primary that reads correctly on
      white is too hot on near-black; 500 carries the same weight.

   Applies on .dark, and automatically when the OS asks for it. */

.dark {
  --dt-surface-base: var(--dt-color-neutral-950);
  --dt-surface-subtle: var(--dt-color-neutral-900);
  --dt-surface-raised: var(--dt-color-neutral-900);
  --dt-surface-sunken: var(--dt-color-black);
  --dt-surface-overlay: var(--dt-color-neutral-800);
  --dt-surface-inverse: var(--dt-color-neutral-050);
  --dt-surface-disabled: var(--dt-color-neutral-800);
  --dt-surface-scrim: oklch(0 0 0 / 0.7);

  --dt-text-primary: var(--dt-color-neutral-050);
  --dt-text-secondary: var(--dt-color-neutral-400);
  --dt-text-tertiary: var(--dt-color-neutral-500);
  --dt-text-disabled: var(--dt-color-neutral-600);
  --dt-text-inverse: var(--dt-color-neutral-900);
  --dt-text-link: var(--dt-color-primary-400);
  --dt-text-link-hover: var(--dt-color-primary-300);
  --dt-text-link-visited: var(--dt-color-violet-400);

  --dt-border-subtle: var(--dt-color-neutral-800);
  --dt-border-default: var(--dt-color-neutral-700);
  --dt-border-strong: var(--dt-color-neutral-500);
  --dt-border-inverse: var(--dt-color-neutral-300);
  --dt-border-disabled: var(--dt-color-neutral-800);

  --dt-surface-action: var(--dt-color-primary-500);
  --dt-surface-action-hover: var(--dt-color-primary-400);
  --dt-surface-action-active: var(--dt-color-primary-300);
  --dt-text-on-action: var(--dt-color-neutral-950);

  --dt-surface-action-secondary: var(--dt-color-neutral-900);
  --dt-surface-action-secondary-hover: var(--dt-color-neutral-800);
  --dt-surface-action-secondary-active: var(--dt-color-neutral-700);
  --dt-text-on-action-secondary: var(--dt-color-neutral-050);
  --dt-border-action-secondary: var(--dt-color-neutral-700);

  --dt-surface-action-ghost-hover: var(--dt-color-neutral-800);
  --dt-surface-action-ghost-active: var(--dt-color-neutral-700);
  --dt-text-on-action-ghost: var(--dt-color-neutral-050);

  --dt-surface-action-danger: var(--dt-color-red-500);
  --dt-surface-action-danger-hover: var(--dt-color-red-400);
  --dt-surface-action-danger-active: var(--dt-color-red-300);
  --dt-text-on-action-danger: var(--dt-color-neutral-950);

  --dt-surface-action-disabled: var(--dt-color-neutral-800);
  --dt-text-on-action-disabled: var(--dt-color-neutral-600);

  --dt-surface-selected: oklch(0.256 0.093 259);
  --dt-surface-selected-hover: oklch(0.344 0.128 259);
  --dt-text-on-selected: var(--dt-color-primary-100);
  --dt-border-selected: var(--dt-color-primary-500);

  --dt-surface-success: var(--dt-color-green-500);
  --dt-surface-success-subtle: var(--dt-color-green-950);
  --dt-border-success: var(--dt-color-green-800);
  --dt-text-success: var(--dt-color-green-300);
  --dt-text-on-success: var(--dt-color-neutral-950);

  --dt-surface-warning: var(--dt-color-amber-400);
  --dt-surface-warning-subtle: var(--dt-color-amber-950);
  --dt-border-warning: var(--dt-color-amber-800);
  --dt-text-warning: var(--dt-color-amber-300);
  --dt-text-on-warning: var(--dt-color-neutral-950);

  --dt-surface-danger: var(--dt-color-red-500);
  --dt-surface-danger-subtle: var(--dt-color-red-950);
  --dt-border-danger: var(--dt-color-red-800);
  --dt-text-danger: var(--dt-color-red-300);
  --dt-text-on-danger: var(--dt-color-neutral-950);

  --dt-surface-info: var(--dt-color-cyan-500);
  --dt-surface-info-subtle: var(--dt-color-cyan-950);
  --dt-border-info: var(--dt-color-cyan-800);
  --dt-text-info: var(--dt-color-cyan-300);
  --dt-text-on-info: var(--dt-color-neutral-950);

  --dt-focus-ring-color: var(--dt-color-primary-400);
  --dt-focus-ring-offset-color: var(--dt-surface-base);

  --dt-viz-1: var(--dt-color-primary-400);
  --dt-viz-2: var(--dt-color-violet-400);
  --dt-viz-3: var(--dt-color-cyan-400);
  --dt-viz-4: var(--dt-color-amber-400);
  --dt-viz-5: var(--dt-color-green-400);
  --dt-viz-6: var(--dt-color-red-400);

  /* Elevation as lightness. Shadows stay for depth cueing but carry less of the work. */
  --dt-elevation-1: 0 1px 2px 0 oklch(0 0 0 / 0.4);
  --dt-elevation-2: 0 2px 6px -1px oklch(0 0 0 / 0.5);
  --dt-elevation-3: 0 6px 12px -2px oklch(0 0 0 / 0.55);
  --dt-elevation-4: 0 12px 24px -4px oklch(0 0 0 / 0.6);
  --dt-elevation-5: 0 24px 48px -8px oklch(0 0 0 / 0.7);
}

/* TIER 3 — BUTTON
   Component tokens exist so a consumer can restyle one component without
   disturbing anything else. They are only authored for components with a real
   override need. Every value here resolves to a semantic token.

   Cascade: override --dt-surface-action and Button, Tabs, Switch and every other
   action surface move together. Override --dt-button-primary-bg and only Button moves. */

:root {
  --dt-button-radius: var(--dt-radius-control);
  --dt-button-font-family: var(--dt-text-label-md-family);
  --dt-button-font-weight: var(--dt-font-weight-medium);
  --dt-button-gap: var(--dt-space-inline-xs);
  --dt-button-border-width: var(--dt-border-width-default);
  --dt-button-transition: var(--dt-motion-micro);

  --dt-button-height-sm: var(--dt-size-control-sm);
  --dt-button-height-md: var(--dt-size-control-md);
  --dt-button-height-lg: var(--dt-size-control-lg);
  --dt-button-padding-sm: var(--dt-space-inset-sm);
  --dt-button-padding-md: var(--dt-space-inset-md);
  --dt-button-padding-lg: var(--dt-space-inset-lg);
  --dt-button-font-size-sm: var(--dt-font-size-sm);
  --dt-button-font-size-md: var(--dt-font-size-sm);
  --dt-button-font-size-lg: var(--dt-font-size-md);

  --dt-button-primary-bg: var(--dt-surface-action);
  --dt-button-primary-bg-hover: var(--dt-surface-action-hover);
  --dt-button-primary-bg-active: var(--dt-surface-action-active);
  --dt-button-primary-fg: var(--dt-text-on-action);
  --dt-button-primary-border: var(--dt-color-transparent);

  --dt-button-secondary-bg: var(--dt-surface-action-secondary);
  --dt-button-secondary-bg-hover: var(--dt-surface-action-secondary-hover);
  --dt-button-secondary-bg-active: var(--dt-surface-action-secondary-active);
  --dt-button-secondary-fg: var(--dt-text-on-action-secondary);
  --dt-button-secondary-border: var(--dt-border-action-secondary);

  --dt-button-ghost-bg: var(--dt-surface-action-ghost);
  --dt-button-ghost-bg-hover: var(--dt-surface-action-ghost-hover);
  --dt-button-ghost-bg-active: var(--dt-surface-action-ghost-active);
  --dt-button-ghost-fg: var(--dt-text-on-action-ghost);
  --dt-button-ghost-border: var(--dt-color-transparent);

  --dt-button-danger-bg: var(--dt-surface-action-danger);
  --dt-button-danger-bg-hover: var(--dt-surface-action-danger-hover);
  --dt-button-danger-bg-active: var(--dt-surface-action-danger-active);
  --dt-button-danger-fg: var(--dt-text-on-action-danger);
  --dt-button-danger-border: var(--dt-color-transparent);

  --dt-button-disabled-bg: var(--dt-surface-action-disabled);
  --dt-button-disabled-fg: var(--dt-text-on-action-disabled);
  --dt-button-disabled-border: var(--dt-color-transparent);
}

/* TIER 3 — INPUT
   Shared by Input, Textarea, Select, and Combobox so every field in a form has
   identical geometry. A field that is 1px taller than its neighbour is the most
   common and most visible design-system failure. */

:root {
  --dt-input-radius: var(--dt-radius-control);
  --dt-input-border-width: var(--dt-border-width-default);
  --dt-input-transition: var(--dt-motion-micro);
  --dt-input-font-size: var(--dt-font-size-sm);
  --dt-input-font-family: var(--dt-text-body-md-family);

  --dt-input-height-sm: var(--dt-size-control-sm);
  --dt-input-height-md: var(--dt-size-control-md);
  --dt-input-height-lg: var(--dt-size-control-lg);
  --dt-input-padding-x: var(--dt-space-inset-sm);

  --dt-input-bg: var(--dt-surface-base);
  --dt-input-bg-hover: var(--dt-surface-base);
  --dt-input-bg-disabled: var(--dt-surface-disabled);
  --dt-input-fg: var(--dt-text-primary);
  --dt-input-fg-placeholder: var(--dt-text-tertiary);
  --dt-input-fg-disabled: var(--dt-text-disabled);

  --dt-input-border: var(--dt-border-default);
  --dt-input-border-hover: var(--dt-border-strong);
  --dt-input-border-focus: var(--dt-focus-ring-color);
  --dt-input-border-error: var(--dt-surface-danger);
  --dt-input-border-disabled: var(--dt-border-disabled);

  --dt-input-label-gap: var(--dt-space-stack-2xs);
  --dt-input-hint-gap: var(--dt-space-stack-2xs);
  --dt-input-hint-color: var(--dt-text-secondary);
  --dt-input-error-color: var(--dt-text-danger);
}

/* TIER 3 — CARD
   Card is the most-overridden component in every system, because it is the one
   that carries a product's surface personality. Its tokens are exposed so a
   consumer can go from bordered-and-flat to shadowed-and-round without a fork. */

:root {
  --dt-card-bg: var(--dt-surface-raised);
  --dt-card-fg: var(--dt-text-primary);
  --dt-card-border-color: var(--dt-border-default);
  --dt-card-border-width: var(--dt-border-width-default);
  --dt-card-radius: var(--dt-radius-container);
  --dt-card-padding: var(--dt-space-inset-lg);
  --dt-card-gap: var(--dt-space-stack-sm);
  --dt-card-elevation: var(--dt-elevation-1); /* @kind other */
  --dt-card-elevation-hover: var(--dt-elevation-2); /* @kind other */
  --dt-card-transition: var(--dt-motion-micro);

  --dt-card-selected-border: var(--dt-border-selected);
  --dt-card-selected-bg: var(--dt-surface-selected);
}

/* TIER 3 — DIALOG
   Covers Dialog, Drawer, Popover, and Sheet — every overlay shares one scrim,

/* Contexts come last: they retune semantic and component tokens, and at equal
   specificity source order decides. */
/* CONTEXT — PRODUCT

   controls are compact, elevation is subtle, and section rhythm is tight. The same
   Button that anchors a marketing hero has to sit in a toolbar without shouting.

   Components do not know which context they are in. They read semantic tokens;
   the context retunes those tokens. That is the whole mechanism — a context is a
   theme for scale and rhythm rather than for colour.

  --dt-text-heading-lg-size: var(--dt-font-size-xl);
  --dt-text-heading-lg-line: var(--dt-line-height-xl);
  --dt-text-heading-md-size: var(--dt-font-size-lg);
  --dt-text-heading-md-line: var(--dt-line-height-lg);

   breathe, controls are touch-first, and cards lose their borders because the page is
   already doing the structural work.

   a content block on a landing page; in product context it is a panel in a dashboard.

   reads them and writes them onto the document root, so every page that loads it shows
   the saved theme. It is a preview mechanism: it makes a theme judgeable across the whole
   system before you commit to it. Nothing here belongs in production.

   tokens/themes/theme-custom.css. That version needs no JavaScript and survives a
   cleared cache.

   Depth matters — from a subdirectory, use ../templates/_support/theme-runtime.js.

   project into _ds_bundle.js, and templates/ is the one tree it skips. This is a page

  window.addEventListener("storage", function (e) { if (e.key === KEY) apply(load()); });
