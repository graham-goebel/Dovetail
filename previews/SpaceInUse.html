<!DOCTYPE html>
<html><head>
<!-- dovetail-site-runtime: added by tools/build-site.mjs so this card runs on its own -->
<script src="../system/components/lib/react.production.min.js"></script>
<script src="../system/components/lib/react-dom.production.min.js"></script>
<script src="../system/components/bundle.js"></script>
<script src="../system/templates/_support/card-theme-sync.js"></script><meta charset="utf-8"><link rel="stylesheet" href="../system/styles.css"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>body{margin:0;padding:16px 20px;font-family:var(--dt-font-family-sans);color:var(--dt-text-primary);background:var(--dt-surface-base)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}
.sw{flex:1;height:96px;border-radius:var(--dt-radius-container);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:11px;font-weight:500;line-height:1.3}
.sw b{font-weight:600}.sw i{font-style:normal;opacity:.72;font-size:10px}
.lbl{font-size:11px;color:var(--dt-text-tertiary);font-family:var(--dt-font-family-mono)}
table{border-collapse:collapse;width:100%;font-size:12px}td{padding:4px 10px 4px 0;vertical-align:middle}
td.k{font-family:var(--dt-font-family-mono);color:var(--dt-text-secondary);white-space:nowrap}
td.v{color:var(--dt-text-tertiary);font-family:var(--dt-font-family-mono);white-space:nowrap}</style>
<link rel="stylesheet" href="../system/tokens/contexts/context-product.css"><link rel="stylesheet" href="../system/tokens/contexts/context-marketing.css"><link rel="stylesheet" href="../system/tokens/contexts/context-social.css">

<div style="background:var(--dt-card-bg);border:1px solid var(--dt-card-border-color);border-radius:var(--dt-card-radius);padding:var(--dt-card-padding);max-width:360px;box-shadow:var(--dt-card-elevation)">
<div style="display:flex;flex-direction:column;gap:var(--dt-space-stack-xs)">
<div style="font-family:var(--dt-text-eyebrow-family);font-size:var(--dt-text-eyebrow-size);font-weight:var(--dt-text-eyebrow-weight);letter-spacing:var(--dt-text-eyebrow-tracking);text-transform:uppercase;color:var(--dt-text-secondary)">Changelog</div>
<div style="font-size:var(--dt-text-heading-sm-size);line-height:var(--dt-text-heading-sm-line);font-weight:var(--dt-text-heading-sm-weight)">Dovetail 1.0</div>
<div style="font-size:var(--dt-text-body-sm-size);line-height:var(--dt-text-body-sm-line);color:var(--dt-text-secondary)">Token architecture, two demo themes, and the first component set.</div>
<div style="display:flex;gap:var(--dt-space-inline-xs);margin-top:var(--dt-space-stack-xs)">
<span style="height:var(--dt-size-control-sm);padding:0 var(--dt-space-inset-sm);border-radius:var(--dt-radius-control);background:var(--dt-surface-action);color:var(--dt-text-on-action);display:inline-flex;align-items:center;font-size:13px;font-weight:500">Read the notes</span>
<span style="height:var(--dt-size-control-sm);padding:0 var(--dt-space-inset-sm);border-radius:var(--dt-radius-control);border:1px solid var(--dt-border-action-secondary);display:inline-flex;align-items:center;font-size:13px;font-weight:500">Dismiss</span>
</div></div></div>
