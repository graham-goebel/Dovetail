<style data-from="../tokens/themes/theme-mono.css">/* THEME — MONOCHROME MINIMAL
   No brand hue at all. Action colour is the darkest neutral, borders do the work
   that fills usually do, and shape is square. The opposite pole from Editorial —
   between the two, a consumer can see the full range the token contract supports.

   Semantic feedback colours stay chromatic. A monochrome error state is an
   accessibility failure, not a design choice.

   Link after styles.css:
     <link rel="stylesheet" href="tokens/themes/theme-mono.css"> */

:root {
  /* Action reads as ink, not colour. */
  --dt-surface-action: var(--dt-color-neutral-950);
  --dt-surface-action-hover: var(--dt-color-neutral-800);
  --dt-surface-action-active: var(--dt-color-neutral-700);
  --dt-text-on-action: var(--dt-color-white);

  --dt-text-link: var(--dt-color-neutral-950);
  --dt-text-link-hover: var(--dt-color-neutral-600);
  --dt-text-link-visited: var(--dt-color-neutral-700);

  --dt-surface-selected: var(--dt-color-neutral-100);
  --dt-surface-selected-hover: var(--dt-color-neutral-200);
  --dt-text-on-selected: var(--dt-color-neutral-950);
  --dt-border-selected: var(--dt-color-neutral-950);

  --dt-focus-ring-color: var(--dt-color-neutral-950);

  /* Square, high-contrast shape. Borders carry the structure. */
  --dt-radius-control: var(--dt-radius-raw-0);
  --dt-radius-container: var(--dt-radius-raw-0);
  --dt-radius-overlay: var(--dt-radius-raw-0);
  --dt-radius-media: var(--dt-radius-raw-0);
  --dt-radius-pill: var(--dt-radius-raw-0);

  --dt-border-default: var(--dt-color-neutral-300);
  --dt-border-strong: var(--dt-color-neutral-950);
  --dt-border-action-secondary: var(--dt-color-neutral-950);

  /* Flat. Elevation is communicated by border weight instead of shadow. */
  --dt-elevation-1: none;
  --dt-elevation-2: none;
  --dt-elevation-3: 0 0 0 1px var(--dt-color-neutral-300);
  --dt-elevation-4: 0 0 0 1px var(--dt-color-neutral-950);
  --dt-elevation-5: 0 0 0 1px var(--dt-color-neutral-950);

  /* Tighter, more mechanical type. */
  --dt-text-display-lg-tracking: var(--dt-tracking-tighter);
  --dt-text-display-md-tracking: var(--dt-tracking-tighter);
  --dt-text-heading-xl-tracking: var(--dt-tracking-tighter);
  --dt-text-label-md-family: var(--dt-font-family-mono);
  --dt-text-label-sm-family: var(--dt-font-family-mono);
  --dt-text-eyebrow-family: var(--dt-font-family-mono);

  /* Data visualisation falls back to a lightness ramp. */
  --dt-viz-1: var(--dt-color-neutral-950);
  --dt-viz-2: var(--dt-color-neutral-700);
  --dt-viz-3: var(--dt-color-neutral-500);
  --dt-viz-4: var(--dt-color-neutral-400);
  --dt-viz-5: var(--dt-color-neutral-300);
  --dt-viz-6: var(--dt-color-neutral-200);
}
</style>
<style>body{margin:0;padding:16px 20px;font-family:var(--dt-font-family-sans);color:var(--dt-text-primary);background:var(--dt-surface-base)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}
.sw{flex:1;height:96px;border-radius:var(--dt-radius-container);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:11px;font-weight:500;line-height:1.3}
.sw b{font-weight:600}.sw i{font-style:normal;opacity:.72;font-size:10px}
.lbl{font-size:11px;color:var(--dt-text-tertiary);font-family:var(--dt-font-family-mono)}
table{border-collapse:collapse;width:100%;font-size:12px}td{padding:4px 10px 4px 0;vertical-align:middle}
td.k{font-family:var(--dt-font-family-mono);color:var(--dt-text-secondary);white-space:nowrap}
td.v{color:var(--dt-text-tertiary);font-family:var(--dt-font-family-mono);white-space:nowrap}</style>
<link rel="stylesheet" href="../system/tokens/contexts/context-product.css"><link rel="stylesheet" href="../system/tokens/contexts/context-marketing.css"><link rel="stylesheet" href="../system/tokens/contexts/context-social.css">
</head><body>
<div style="display:flex;gap:16px;align-items:flex-start">
<div style="flex:1"><div style="font-family:var(--dt-text-heading-lg-family);font-size:var(--dt-text-heading-lg-size);line-height:var(--dt-text-heading-lg-line);font-weight:var(--dt-text-heading-lg-weight);letter-spacing:var(--dt-text-heading-lg-tracking)">No brand hue at all</div>
<div style="font-size:var(--dt-text-body-sm-size);line-height:var(--dt-text-body-sm-line);color:var(--dt-text-secondary);margin:6px 0 12px">Action colour is ink. Feedback colours stay chromatic.</div>
<div style="display:flex;gap:8px"><span style="height:var(--dt-size-control-md);padding:0 var(--dt-space-inset-lg);border-radius:var(--dt-radius-control);background:var(--dt-surface-action);color:var(--dt-text-on-action);display:inline-flex;align-items:center;font-size:14px;font-weight:500">Continue</span>
<span style="height:var(--dt-size-control-md);padding:0 var(--dt-space-inset-lg);border-radius:var(--dt-radius-control);border:1px solid var(--dt-border-action-secondary);display:inline-flex;align-items:center;font-size:14px;font-weight:500">Cancel</span>
<span style="height:var(--dt-size-control-md);padding:0 var(--dt-space-inset-md);border-radius:var(--dt-radius-control);background:var(--dt-surface-danger-subtle);border:1px solid var(--dt-border-danger);color:var(--dt-text-danger);display:inline-flex;align-items:center;font-size:13px">Error kept chromatic</span></div></div>
<div class="col" style="width:150px;gap:0"><div style="height:20px;background:var(--dt-color-neutral-950)"></div><div style="height:20px;background:var(--dt-color-neutral-700)"></div><div style="height:20px;background:var(--dt-color-neutral-500)"></div><div style="height:20px;background:var(--dt-color-neutral-300)"></div><div style="height:20px;background:var(--dt-color-neutral-100)"></div></div></div>
</body></html>
