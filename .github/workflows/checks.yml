name: Checks

# Runs on every pull request, and on main after a merge. Branch protection
# should require every job here before a pull request can merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build is current, changelog is recorded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog check diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generated files are current
        run: npm run check:build

      - name: Changelog entries are valid
        run: node tools/changelog.mjs --check

      - name: The builder's model passes its unit tests
        run: npm run check:unit

      - name: Every component renders on the server
        run: npm run check:ssr

      - name: The package builds, imports, renders and type-checks
        run: npm run check:package

      - name: The packed package installs and works in a clean project
        run: npm run check:consumer

      # A pull request that changes what the system ships must add an entry to
      # changes/. The skip-changelog label turns this off for the rare pull
      # request with nothing to say; prefer an entry with `bump: none`.
      - name: This pull request records its change
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        env:
          BASE: ${{ github.base_ref }}
        run: node tools/changelog.mjs --check --base "origin/$BASE"

  # The three browser checks share nothing, so each is its own job and the
  # wall time is the longest of them rather than their sum. Chromium is
  # cached by Playwright's version, so a run doesn't download it again.
  browser:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: "Every card and page loads cleanly", script: "check:browser" }
          - { name: "Dialog, Drawer and Tabs behave in a real browser", script: "check:behavior" }
          - { name: "The builder places, styles, exports and shares", script: "check:builder" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Playwright's version, for the browser cache
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The system libraries aren't cached with the browser; they're quick.
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run ${{ matrix.check.script }}
