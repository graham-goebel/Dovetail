name: Release

# Publishes a release whenever main carries a version that has no tag yet.
#
# The release itself happens in a pull request: `node tools/changelog.mjs
# --release` compiles changes/ into a new CHANGELOG.md section and bumps
# package.json, and a "Release x.y.z" pull request carries that into main.
# When it merges, this workflow reads the version from package.json, tags the
# merge commit vX.Y.Z, and creates the GitHub release with that version's
# CHANGELOG.md section as its notes. Nobody pushes tags by hand.
#
# It does nothing on a push that leaves the version alone, or when the tag
# already exists, so re-running it is always safe.
#
# After the release exists, a second job stages the package on npm. The
# NPM_TOKEN secret is a stage-only token: it can upload a version but not make
# it public, so no one-time password is needed here. A maintainer then approves
# the staged version with 2FA (on npmjs.com, or `npm stage approve <id>`), and
# that approval is the publish. `id-token: write` lets npm sign the provenance.
#
# The job runs when this run created the release, or when the workflow is
# started by hand ("Run workflow" on main), which is how a version that is
# tagged but not yet on npm gets staged. It skips a version npm already has,
# and anything while package.json is "private": true.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version."
          fi

      # A version without its changelog section is a release made by hand
      # without the tool, so it stops here rather than publishing empty notes.
      - name: Take the notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tools/changelog.mjs --notes "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Tag and publish the release
        id: release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Dovetail $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # Publishes the version the release job just tagged. It is skipped, not
  # failed, when no release was created in this run.
  publish:
    needs: release
    if: >-
      (needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this package is published
        id: gate
        run: |
          name=$(node -p "require('./package.json').name")
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json is private, so v$VERSION was tagged and released on GitHub but not published to npm. Remove \"private\" to publish."
          elif npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$VERSION is already on npm; nothing to stage."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Staging $name@$VERSION on npm."
          fi

      - name: Require NPM_TOKEN
        if: steps.gate.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set, so v$VERSION cannot be staged on npm. Add an npm granular token with stage-only write access under Settings > Secrets and variables > Actions, then re-run the failed jobs of this run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.gate.outputs.publish == 'true'
        run: npm ci

      - name: Build the package
        if: steps.gate.outputs.publish == 'true'
        run: npm run build:package

      # What a real install gets: packs the tarball, installs it into a clean
      # project and renders, resolves and type-checks from there.
      - name: Check the package as a consumer installs it
        if: steps.gate.outputs.publish == 'true'
        run: node tools/check/consumer.mjs

      # `npm stage` arrived in npm 11; Node 22 bundles npm 10.
      - name: Use npm 12
        if: steps.gate.outputs.publish == 'true'
        run: npm install -g npm@12

      - name: Stage on npm
        if: steps.gate.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage publish --provenance --access public
          name=$(node -p "require('./package.json').name")
          {
            echo "### $name@$VERSION is staged on npm"
            echo
            echo "It is not public until a maintainer approves it with 2FA: on npmjs.com,"
            echo "or with \`npm stage list $name\` then \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
