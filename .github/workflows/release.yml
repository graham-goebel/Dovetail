name: Release

# Publishes a release whenever main carries a version that has no tag yet.
#
# The release itself happens in a pull request: `node tools/changelog.mjs
# --release` compiles changes/ into a new CHANGELOG.md section and bumps
# package.json, and a "Release x.y.z" pull request carries that into main.
# When it merges, this workflow reads the version from package.json, tags the
# merge commit vX.Y.Z, and creates the GitHub release with that version's
# CHANGELOG.md section as its notes. Nobody pushes tags by hand.
#
# It does nothing on a push that leaves the version alone, or when the tag
# already exists, so re-running it is always safe.
#
# After the release exists, a second job publishes the package to npm. It runs
# only when this run created the release, on main, and only while package.json
# is not "private": true. It needs an NPM_TOKEN repository secret (an npm
# automation token that can publish the package) and fails with a message if
# the secret is missing. `id-token: write` is what lets npm sign the provenance
# statement. If the publish fails, use "Re-run failed jobs" on this run: the
# release job's outputs are kept, so it publishes the same version again
# without trying to tag it twice.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version."
          fi

      # A version without its changelog section is a release made by hand
      # without the tool, so it stops here rather than publishing empty notes.
      - name: Take the notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tools/changelog.mjs --notes "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Tag and publish the release
        id: release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Dovetail $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # Publishes the version the release job just tagged. It is skipped, not
  # failed, when no release was created in this run.
  publish:
    needs: release
    if: >-
      needs.release.outputs.created == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this package is published
        id: gate
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json is private, so v$VERSION was tagged and released on GitHub but not published to npm. Remove \"private\" to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $(node -p "require('./package.json').name")@$VERSION to npm."
          fi

      - name: Require NPM_TOKEN
        if: steps.gate.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set, so v$VERSION cannot be published to npm. Add an npm automation token under Settings > Secrets and variables > Actions, then re-run the failed jobs of this run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.gate.outputs.publish == 'true'
        run: npm ci

      - name: Build the package
        if: steps.gate.outputs.publish == 'true'
        run: npm run build:package

      # What a real install gets: packs the tarball, installs it into a clean
      # project and renders, resolves and type-checks from there.
      - name: Check the package as a consumer installs it
        if: steps.gate.outputs.publish == 'true'
        run: node tools/check/consumer.mjs

      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
