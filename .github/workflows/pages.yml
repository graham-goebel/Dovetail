name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/html-github-pages-site-ubrllr
  workflow_dispatch:

# Pages needs to read the checkout, write the deployment, and mint an OIDC
# token for the deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Same build as `npm run build`: the component bundle and card kit, then
      # the site. The deploy refuses output that is behind its sources.
      - name: Build the bundle and the site
        run: npm run build

      - name: Check the committed output is current
        run: |
          if ! git diff --quiet; then
            echo "The generated files differ from what is committed."
            echo "Run 'npm run build' and commit the result."
            git diff --stat
            exit 1
          fi

      # enablement turns Pages on for the repository the first time this runs,
      # so nothing has to be set by hand in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # upload-pages-artifact excludes .git and .github, so the whole
      # repository root is the site: pages, previews, and system/ beside them.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
