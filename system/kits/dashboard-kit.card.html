body{margin:0;background:var(--dt-surface-subtle);padding-bottom:88px}

@media (max-width:560px){.statrow{grid-template-columns:1fr}}

<script>
/* Token-propagating asset loader. The page URL carries an auth token; project-relative
   subresource URLs do not inherit it and come back 401, so every request is built with
   the token appended. CSS is fetched and its @import closure resolved here, then
   injected as one <style> — a <link> loads, but its imports resolve without the token
   and 401 silently, leaving a sheet with rules and none of the tokens they pull in. */
(function () {
  var Q = (function () {
    var t = new URLSearchParams(location.search).get("t");
    return t ? "?t=" + t : "";
  })();
  var B = "../";
  var failures = [];
  window.DT_ASSET_FAILURES = failures;
  function url(p) { return B + p + Q; }
  function normalise(p) {
    var out = [];
    p.split("/").forEach(function (s) { if (s === "." || s === "") return; if (s === "..") out.pop(); else out.push(s); });
    return out.join("/");
  }
  function resolveCss(path) {
    return fetch(url(path))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) {
        var dir = path.replace(/[^/]*$/, "");
        var re = /@import\s+(?:url\()?["']?([^"')]+)["']?\)?\s*;/g;
        var parts = [], jobs = [], last = 0, m;
        while ((m = re.exec(txt))) {
          parts.push(txt.slice(last, m.index));
          last = m.index + m[0].length;
          if (/^(https?:)?\/\//.test(m[1])) { parts.push(m[0]); continue; }
          jobs.push({ slot: parts.length, path: normalise(dir + m[1]) });
          parts.push("");
        }
        parts.push(txt.slice(last));
        return Promise.all(jobs.map(function (j) {
          return resolveCss(j.path).then(function (css) { parts[j.slot] = css; });
        })).then(function () { return parts.join("\n"); });
      })
      .catch(function (e) { failures.push(path + " (" + e.message + ")"); return ""; });
  }
  function js(p) {
    return new Promise(function (res) {
      var s = document.createElement("script");
      s.src = url(p);
      s.onload = function () { res(true); };
      s.onerror = function () { failures.push(p); res(false); };
      document.head.appendChild(s);
    });
  }
  window.DT_ASSETS = Promise.all([resolveCss("styles.css")])
    .then(function (sheets) {
      var el = document.createElement("style");
      el.id = "dt-inlined-css";
      el.textContent = sheets.join("\n");
      document.head.appendChild(el);
    })
    .then(function () { return js("_ds_bundle.js"); })
    .then(function () { return js("templates/_support/theme-runtime.js"); })
    .then(function () { return js("templates/_support/theme-switcher.js"); })
    .then(function () { return js("templates/_support/template-icons.js"); })
    .then(function () { return failures; });
})();
</script>

<script type="text/babel">
let Sidebar, Tabs, TabPanel, Breadcrumbs, Table, Stat, Badge, Button, Avatar, AvatarGroup, List, Progress, Banner, EmptyState, Pagination, Inline, Stack, Card, Tag, Image, Video;
const Icon = (props) => window.DovetailTemplateIcons.Icon(props);

const INVOICES = [
  { id: "INV-2041", client: "Northwind Trading", status: "Paid", tone: "success", due: "12 Sep", amount: "$4,200.00" },
  { id: "INV-2042", client: "Halcyon Labs", status: "Due soon", tone: "warning", due: "24 Sep", amount: "$1,875.50" },
  { id: "INV-2043", client: "Pallas Freight", status: "Past due", tone: "danger", due: "06 Sep", amount: "$12,040.00" },
  { id: "INV-2044", client: "Kestrel Analytics", status: "Draft", tone: "neutral", due: "—", amount: "$3,310.00" },
  { id: "INV-2045", client: "Orbit Supply Co.", status: "Paid", tone: "success", due: "01 Sep", amount: "$890.00" },
];

const PEOPLE = [{ name: "Ada Lovelace" }, { name: "Grace Hopper" }, { name: "Alan Turing" }, { name: "Jean Bartik" }, { name: "Margaret Hamilton" }];

/* Reads the photo and illustration a reader dropped in the Configure panel's
   Media tab, the same way the marketing template does. */
function useDovetailMedia() {
  var KEY = "dovetail-docs-media";
  function load() {
    try {
      return Object.assign({ photo: "", illustration: "" }, JSON.parse(localStorage.getItem(KEY)) || {});
    } catch (e) {
      return { photo: "", illustration: "" };
    }
  }
  const [media, setMedia] = React.useState(load);
  React.useEffect(function () {
    function sync(e) {
      if (!e || !e.key || e.key === KEY) setMedia(load());
    }
    window.addEventListener("storage", sync);
    return function () {
      window.removeEventListener("storage", sync);
    };
  }, []);
  return media;
}

/* A file dropped straight onto a placeholder. It stays in this page as an
   object URL: nothing is uploaded or saved, and a reload empties the slot. */
function useDroppedFile() {
  const [url, setUrl] = React.useState("");
  React.useEffect(() => () => { if (url) URL.revokeObjectURL(url); }, [url]);
  return [url, (file) => setUrl(URL.createObjectURL(file))];
}

function PanelTitle({ icon, children }) {
  return <span className="panel-h"><Icon name={icon} size="sm" />{children}</span>;
}

function StatTile({ icon, ...stat }) {
  return (
    <div className="panel stat">
      <Stat {...stat} style={{ minWidth: 0 }} />
      <span className="stat-icon"><Icon name={icon} size="sm" /></span>
    </div>
  );
}

function App() {
  const [nav, setNav] = React.useState("invoices");
  const [tab, setTab] = React.useState("all");
  const [page, setPage] = React.useState(1);
  const media = useDovetailMedia();
  const [photo, dropPhoto] = useDroppedFile();
  const [video, dropVideo] = useDroppedFile();
  const [illustration, dropIllustration] = useDroppedFile();
  const art = illustration || media.illustration;
  const rows = tab === "all" ? INVOICES : INVOICES.filter(r => (tab === "open" ? r.status !== "Paid" : r.status === "Paid"));
  return (
    <div className="shell">
      <Sidebar
        current={nav}
        onNavigate={setNav}
        header={<Inline gap="sm" align="center"><Avatar name="Northwind Trading" shape="square" size="sm" /><span style={{ fontWeight: "var(--dt-font-weight-semibold)" }}>Northwind</span></Inline>}
        footer={<Inline gap="sm" align="center"><Avatar name="Ada Lovelace" size="sm" status="online" /><span style={{ fontSize: "var(--dt-text-body-sm-size)", color: "var(--dt-text-secondary)" }}>Ada Lovelace</span></Inline>}
        sections={[
          { items: [
            { id: "overview", label: "Overview", icon: <Icon name="grid" size="sm" /> },
            { id: "invoices", label: "Invoices", icon: <Icon name="file" size="sm" />, trailing: <Badge>5</Badge> },
            { id: "clients", label: "Clients", icon: <Icon name="users" size="sm" /> },
          ] },
          { title: "Workspace", items: [
            { id: "members", label: "Members", icon: <Icon name="userPlus" size="sm" /> },
            { id: "integrations", label: "Integrations", icon: <Icon name="plug" size="sm" /> },
          ] },
          { title: "Settings", items: [
            { id: "billing", label: "Billing", icon: <Icon name="card" size="sm" /> },
            { id: "security", label: "Security", icon: <Icon name="lock" size="sm" /> },
          ] },
        ]}
      />
      <div className="main">
        <Banner tone="warning" icon={<Icon name="clock" size="sm" />} title="Trial ends in 3 days" action={<Button size="sm">Add payment</Button>}>Your workspace switches to read-only when the trial ends.</Banner>
        <div className="body">
          <Stack gap="sm">
            <Breadcrumbs items={[{ label: "Workspace", href: "#" }, { label: "Billing", href: "#" }, { label: "Invoices" }]} />
            <Inline gap="md" align="center" justify="space-between" wrap>
              <h1 style={{ margin: 0, color: "var(--dt-text-headline, var(--dt-text-primary))", fontSize: "var(--dt-text-heading-lg-size)", fontWeight: "var(--dt-text-heading-lg-weight)", letterSpacing: "var(--dt-text-heading-lg-tracking)" }}>Invoices</h1>
              <Inline gap="sm" align="center" wrap>
                <AvatarGroup people={PEOPLE} max={4} size="sm" label="People with access" />
                <Button size="sm" variant="secondary" iconStart={<Icon name="download" size="sm" />}>Export</Button>
                <Button size="sm" iconStart={<Icon name="plus" size="sm" />}>New invoice</Button>
              </Inline>
            </Inline>
          </Stack>

          <div className="statrow">
            <StatTile icon="wallet" label="Outstanding" value="$18,115" delta="+8.2%" deltaDirection="down" caption="vs. previous 30 days" />
            <StatTile icon="trendUp" label="Collected" value="$41,290" delta="+12.4%" deltaDirection="up" caption="vs. previous 30 days" />
            <StatTile icon="calendar" label="Median days to pay" value="11" unit="days" delta="−2" deltaDirection="up" caption="vs. previous 30 days" />
            <StatTile icon="alert" label="Past due" value="1" delta="0" deltaDirection="flat" caption="unchanged this week" />
          </div>

          <div className="two">
            <div className="panel">
              <Stack gap="md">
                <Tabs label="Invoice filter" variant="pill" value={tab} onChange={setTab} style={{ display: "inline-flex" }}
                  tabs={[{ id: "all", label: "All", count: INVOICES.length }, { id: "open", label: "Open" }, { id: "paid", label: "Paid" }]} />
                <TabPanel id={tab} value={tab}>
                  {rows.length === 0 ? (
                    <EmptyState size="sm" icon={<Icon name="file" size="lg" />} title="No invoices in this view" description="Try another filter or create an invoice." action={<Button size="sm" iconStart={<Icon name="plus" size="sm" />}>New invoice</Button>} />
                  ) : (
                    <div className="table-scroll"><Table
                      caption={rows.length + " invoices, last 30 days"}
                      columns={[
                        { key: "id", header: "Invoice", width: "108px" },
                        { key: "client", header: "Client" },
                        { key: "status", header: "Status", render: r => <Badge tone={r.tone} dot>{r.status}</Badge> },
                        { key: "due", header: "Due" },
                        { key: "amount", header: "Amount", align: "right" },
                      ]}
                      rows={rows}
                    /></div>
                  )}
                </TabPanel>
                <Pagination page={page} totalPages={6} onChange={setPage} />
              </Stack>
            </div>

            <Stack gap="lg">
              <div className="panel">
                <Stack gap="md">
                  <PanelTitle icon="zap">Plan usage</PanelTitle>
                  <Progress label="Seats" value={17} max={20} showValue size="sm" tone="warning" />
                  <Progress label="Storage" value={42} max={100} showValue size="sm" />
                  <Progress label="API calls" value={68} max={100} showValue size="sm" />
                </Stack>
              </div>
              <div className="panel">
                <Stack gap="sm">
                  <PanelTitle icon="bell">Recent activity</PanelTitle>
                  <List label="Recent activity" items={[
                    { id: 1, leading: <Avatar name="Grace Hopper" size="sm" />, title: "Grace sent INV-2043", description: "2 hours ago" },
                    { id: 2, leading: <Avatar name="Alan Turing" size="sm" />, title: "Alan marked INV-2041 paid", description: "Yesterday" },
                    { id: 3, leading: <Avatar name="Jean Bartik" size="sm" />, title: "Jean added Kestrel Analytics", description: "2 days ago" },
                  ]} />
                </Stack>
              </div>
            </Stack>
          </div>

          <div className="three">
            <Card
              media={<Image src={photo || media.photo} alt="" ratio="16:9" placeholder="Client photo" onFile={dropPhoto} />}
              eyebrow="Client spotlight"
              title="Pallas Freight"
              description="Largest open balance: $12,040, six days past due."
              footer={<Button size="sm" variant="secondary" iconStart={<Icon name="send" size="sm" />}>Send reminder</Button>}
            />
            <Card
              media={<Video src={video} label="Product tour" placeholder="Product tour video" onFile={dropVideo} ratio="16:9" />}
              eyebrow="Getting started"
              title="Take the tour"
              description="Two minutes on how invoices, reminders and payouts fit together."
              footer={<Button size="sm" variant="secondary" iconStart={<Icon name="play" size="sm" />}>Watch</Button>}
            />
            <Card
              media={art
                ? <div className="art"><img src={art} alt="" /></div>
                : <Image alt="" ratio="16:9" placeholder="Illustration" onFile={dropIllustration} />}
              eyebrow="Workspace"
              title="Invite your team"
              description="Three seats left on your plan. Teammates see every client and invoice."
              footer={<Button size="sm" iconStart={<Icon name="userPlus" size="sm" />}>Invite people</Button>}
            />
          </div>
        </div>
      </div>
    </div>
  );
}

function dsReady(required, done) {
  var NS_KEY = "BeamMobileDesignSystem_e33121";
  var REFETCH_AT = 1200, DEADLINE = 8000, TICK = 40;
  var startedAt = Date.now(), refetched = false;
  /* Wall clock, not tick count: a throttled frame stretches a 40ms timeout well past
     40ms, which would push the deadline minutes out. */
  function elapsed() { return Date.now() - startedAt; }
  function missing() {
    var ns = window[NS_KEY];
    if (!ns) return required.slice();
    var out = [];
    for (var i = 0; i < required.length; i++) if (!ns[required[i]]) out.push(required[i]);
    return out;
  }
  (function poll() {
    var gaps = missing();
    if (gaps.length === 0) return done(window[NS_KEY]);
    if (elapsed() > REFETCH_AT && !refetched) {
      refetched = true;
      var base = document.querySelector('script[src$="_ds_bundle.js"]');
      var s = document.createElement("script");
      s.src = (base ? base.getAttribute("src") : "_ds_bundle.js") + "?cb=" + Date.now();
      document.head.appendChild(s);
    }
    if (elapsed() > DEADLINE) {
      var root = document.getElementById("root");
      if (root) root.innerHTML = '<div role="alert" style="max-width:62ch;margin:48px auto;padding:20px 24px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#3f3f46"><strong style="display:block;margin-bottom:6px;color:#18181b">This kit could not load the design system</strong>' + (!window[NS_KEY] ? '<code>_ds_bundle.js</code> did not load. It is regenerated whenever components change \u2014 reload in a moment.' : 'The loaded bundle is missing: <code>' + gaps.join(", ") + '</code>. Hard reload to clear the cached copy.') + '</div>';
      return;
    }
    setTimeout(poll, TICK);
  })();
}

dsReady(["Sidebar","Tabs","TabPanel","Breadcrumbs","Table","Stat","Badge","Button","Avatar","AvatarGroup","List","Progress","Banner","EmptyState","Pagination","Inline","Stack","Card","Tag","Image","Video"], function (NS) {
  ({ Sidebar, Tabs, TabPanel, Breadcrumbs, Table, Stat, Badge, Button, Avatar, AvatarGroup, List, Progress, Banner, EmptyState, Pagination, Inline, Stack, Card, Tag, Image, Video } = NS);
  window.DT_ASSETS.then(function () {
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  });
});
</script>
</body></html>
