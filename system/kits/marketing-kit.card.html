<script>
/* Token-propagating asset loader. The page URL carries an auth token; project-relative
   subresource URLs do not inherit it and come back 401, so every request is built with
   the token appended. CSS is fetched and its @import closure resolved here, then
   injected as one <style> — a <link> loads, but its imports resolve without the token
   and 401 silently, leaving a sheet with rules and none of the tokens they pull in. */
(function () {
  var Q = (function () {
    var t = new URLSearchParams(location.search).get("t");
    return t ? "?t=" + t : "";
  })();
  var B = "../";
  var failures = [];
  window.DT_ASSET_FAILURES = failures;
  function url(p) { return B + p + Q; }
  function normalise(p) {
    var out = [];
    p.split("/").forEach(function (s) { if (s === "." || s === "") return; if (s === "..") out.pop(); else out.push(s); });
    return out.join("/");
  }
  function resolveCss(path) {
    return fetch(url(path))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) {
        var dir = path.replace(/[^/]*$/, "");
        var re = /@import\s+(?:url\()?["']?([^"')]+)["']?\)?\s*;/g;
        var parts = [], jobs = [], last = 0, m;
        while ((m = re.exec(txt))) {
          parts.push(txt.slice(last, m.index));
          last = m.index + m[0].length;
          if (/^(https?:)?\/\//.test(m[1])) { parts.push(m[0]); continue; }
          jobs.push({ slot: parts.length, path: normalise(dir + m[1]) });
          parts.push("");
        }
        parts.push(txt.slice(last));
        return Promise.all(jobs.map(function (j) {
          return resolveCss(j.path).then(function (css) { parts[j.slot] = css; });
        })).then(function () { return parts.join("\n"); });
      })
      .catch(function (e) { failures.push(path + " (" + e.message + ")"); return ""; });
  }
  function js(p) {
    return new Promise(function (res) {
      var s = document.createElement("script");
      s.src = url(p);
      s.onload = function () { res(true); };
      s.onerror = function () { failures.push(p); res(false); };
      document.head.appendChild(s);
    });
  }
  window.DT_ASSETS = Promise.all([resolveCss("styles.css")])
    .then(function (sheets) {
      var el = document.createElement("style");
      el.id = "dt-inlined-css";
      el.textContent = sheets.join("\n");
      document.head.appendChild(el);
    })
    .then(function () { return js("_ds_bundle.js"); })
    .then(function () { return js("templates/_support/theme-runtime.js"); })
    .then(function () { return js("templates/_support/theme-switcher.js"); })
    .then(function () { return js("templates/_support/template-icons.js"); })
    .then(function () { return failures; });
})();
</script>
</head><body class="dt-context-marketing"><div id="root"></div>
<script type="text/babel">
let Navbar, Button, Card, Badge, Tag, Quote, Accordion, Prose, Callout, Cover, Image, Video, Avatar, Stat, Inline, Stack, Divider;
const Icon = (props) => window.DovetailTemplateIcons.Icon(props);

/* Reads the photo and illustration a reader dropped in the Configure panel's
   Media tab. Both live under one localStorage key, same-origin with this
   card's own page, so a native "storage" event is all it takes to pick up a
   new upload without any message-passing between the two. */
function useDovetailMedia() {
  var KEY = "dovetail-docs-media";
  function load() {
    try {
      return Object.assign({ photo: "", illustration: "" }, JSON.parse(localStorage.getItem(KEY)) || {});
    } catch (e) {
      return { photo: "", illustration: "" };
    }
  }
  const [media, setMedia] = React.useState(load);
  React.useEffect(function () {
    function sync(e) {
      if (!e || !e.key || e.key === KEY) setMedia(load());
    }
    window.addEventListener("storage", sync);
    return function () {
      window.removeEventListener("storage", sync);
    };
  }, []);
  return media;
}

/* A file dropped straight onto a placeholder. It stays in this page as an
   object URL: nothing is uploaded or saved, and a reload empties the slot. */
function useDroppedFile() {
  const [url, setUrl] = React.useState("");
  React.useEffect(() => () => { if (url) URL.revokeObjectURL(url); }, [url]);
  return [url, (file) => setUrl(URL.createObjectURL(file))];
}

function IconTile({ name }) {
  return <span className="icon-tile"><Icon name={name} /></span>;
}

const FEATURES = [
  { icon: "palette", title: "Primitives name values", description: "A ramp of OKLCH colours, a dimension scale, a type scale. Nothing here knows what it is for." },
  { icon: "layers", title: "Semantics name jobs", description: "Surface, text, border, and their paired roles. This is the only tier a component is allowed to read." },
  { icon: "blocks", title: "Components name parts", description: "Button background, input border. Retuned per context without touching the component." },
];

function App() {
  const [nav, setNav] = React.useState("product");
  const media = useDovetailMedia();
  const [photo, dropPhoto] = useDroppedFile();
  const [video, dropVideo] = useDroppedFile();
  const [illustration, dropIllustration] = useDroppedFile();
  const art = illustration || media.illustration;
  return (
    <main>
      <Navbar
        sticky
        brand={<Inline gap="xs" align="center"><span className="mark"><Icon name="sparkle" size="sm" /></span><span style={{ fontWeight: "var(--dt-font-weight-semibold)", fontSize: "var(--dt-text-body-lg-size)", letterSpacing: "var(--dt-tracking-tight)" }}>Dovetail</span></Inline>}
        current={nav}
        onNavigate={setNav}
        links={[{ id: "product", label: "Product" }, { id: "pricing", label: "Pricing" }, { id: "docs", label: "Docs" }, { id: "company", label: "Company" }]}
        actions={<Inline gap="xs" align="center"><Button size="sm" variant="ghost">Sign in</Button><Button size="sm">Start free</Button></Inline>}
      />

      <section className="sec">
        <div className="hero">
          <Stack gap="md">
            <span className="eyebrow">Design system infrastructure</span>
            <h1 className="hero-h">One component set. Every brand you ship.</h1>
            <p className="lead">Dovetail is white-label by construction. Components read semantic tokens, tokens read a brand theme, and swapping the theme changes every surface at once, without touching a component.</p>
            <Inline gap="sm" wrap>
              <Button iconEnd={<Icon name="arrowRight" size="sm" />}>Start free</Button>
              <Button variant="secondary" iconStart={<Icon name="book" size="sm" />}>Read the docs</Button>
            </Inline>
            <Inline gap="xs" wrap><Tag>No lock-in</Tag><Tag>DTCG tokens</Tag><Tag>Light and dark</Tag></Inline>
          </Stack>
          <Cover src={photo || media.photo} alt="" ratio="4:3" placeholder="Product photo" onFile={dropPhoto} scrim="none" style={{ border: "var(--dt-border-width-default) solid var(--dt-border-subtle)" }} />
        </div>
      </section>

      <section className="sec alt">
        <Stack gap="xs" style={{ textAlign: "center", alignItems: "center" }}>
          <span className="eyebrow">Why it holds</span>
          <h2 className="sec-h">Three tiers, referenced one way</h2>
        </Stack>
        <div className="three">
          {FEATURES.map((f) => <Card key={f.icon} media={<IconTile name={f.icon} />} title={f.title} description={f.description} />)}
        </div>
      </section>

      <section className="sec">
        <div className="two">
          <Video src={video} label="Product walkthrough" placeholder="Product walkthrough video" onFile={dropVideo} ratio="16:9" style={{ border: "var(--dt-border-width-default) solid var(--dt-border-subtle)" }} />
          <Stack gap="md">
            <span className="eyebrow">See it run</span>
            <h2 className="sec-h">Retheme a whole product in one pass</h2>
            <p className="lead">Pick a brand colour, a type family and a corner radius. Every screen follows, because no component holds a value of its own.</p>
            <ul className="checks">
              <li><Icon name="check" size="sm" />Light and dark from the same roles</li>
              <li><Icon name="check" size="sm" />Contrast checked on every pairing</li>
              <li><Icon name="check" size="sm" />Exports CSS and DTCG tokens</li>
            </ul>
            <Inline gap="sm" wrap><Button variant="secondary" iconStart={<Icon name="play" size="sm" />}>Watch the tour</Button></Inline>
          </Stack>
        </div>
      </section>

      <section className="sec alt">
        <div className="two">
          <Stack gap="md">
            <span className="eyebrow">Proof</span>
            <h2 className="sec-h">The audit that took a week now runs in CI</h2>
            <p className="lead">The adherence lint rejects literal values before review. If a colour is not a token, the build says so.</p>
            <div className="stats">
              <Stack gap="sm"><IconTile name="box" /><Stat label="Components" value="63" caption="across eight groups" /></Stack>
              <Stack gap="sm"><IconTile name="zap" /><Stat label="Tokens" value="658" caption="three tiers, DTCG authored" /></Stack>
              <Stack gap="sm"><IconTile name="shield" /><Stat label="Themes" value="4" caption="base, dark, editorial, mono" /></Stack>
            </div>
          </Stack>
          <Stack gap="lg">
            <Quote attribution="Grace Hopper" role="Head of Platform, Halcyon Labs" avatar={<Avatar name="Grace Hopper" />}>
              We replaced four separate button implementations with one.
            </Quote>
            <Divider />
            <Quote attribution="Ada Lovelace" role="Design Systems Lead, Northwind" avatar={<Avatar name="Ada Lovelace" />}>
              Tokens made the redesign a config change instead of a rewrite.
            </Quote>
          </Stack>
        </div>
      </section>

      <section className="sec">
        <Stack gap="xs" style={{ alignItems: "center", textAlign: "center" }}>
          <span className="eyebrow">Questions</span>
          <h2 className="sec-h">Before you adopt it</h2>
        </Stack>
        <div style={{ maxWidth: 760, margin: "0 auto", width: "100%" }}>
          <Accordion label="Adoption questions" defaultOpen={["a"]} items={[
            { id: "a", title: "Can we keep our own brand?", content: "That is the point. Dovetail ships no logo and no brand colour. You supply a primary ramp and a type family; every component picks them up through the semantic tier." },
            { id: "b", title: "Does it work outside React?", content: "The tokens do. They are authored in DTCG format and build to CSS custom properties, so any framework can consume them. The component layer is React." },
            { id: "c", title: "What about dark mode and density?", content: "Both are axes alongside brand theme and context. A component never knows which combination it is rendering under: it reads roles, and the roles are retuned." },
          ]} />
        </div>
      </section>

      <section className="sec alt">
        <div style={{ maxWidth: 760, margin: "0 auto", width: "100%" }}>
          <Prose>
            <h2 className="sec-h">Start with the tokens, not the components</h2>
            <p style={{ margin: 0 }}>Teams that adopt the component library first end up with a second system underneath it: the values their product already uses, now hidden behind imports. Adopting the token layer first surfaces those values as a diff you can argue about.</p>
            <Callout tone="tip" title="A useful first week" icon={<Icon name="sparkle" size="sm" />}>Replace literal colours in one screen with semantic tokens and run the lint. The list of failures is your real migration scope.</Callout>
          </Prose>
        </div>
      </section>

      <section className="sec">
        <div className="cta">
          <Stack gap="md">
            <h2 className="sec-h">Ship your brand, not ours</h2>
            <p className="lead">Free while you evaluate. No card, no call.</p>
            <Inline gap="sm" wrap><Button iconEnd={<Icon name="arrowRight" size="sm" />}>Start free</Button><Button variant="secondary" iconStart={<Icon name="send" size="sm" />}>Talk to us</Button></Inline>
          </Stack>
          <div className="cta-art">
            {art
              ? <img className="cta-illustration" src={art} alt="" />
              : <Image alt="" ratio="1:1" placeholder="Illustration" onFile={dropIllustration} radius="container" />}
          </div>
        </div>
      </section>
    </main>
  );
}

function dsReady(required, done) {
  var NS_KEY = "BeamMobileDesignSystem_e33121";
  var REFETCH_AT = 1200, DEADLINE = 8000, TICK = 40;
  var startedAt = Date.now(), refetched = false;
  /* Wall clock, not tick count: a throttled frame stretches a 40ms timeout well past
     40ms, which would push the deadline minutes out. */
  function elapsed() { return Date.now() - startedAt; }
  function missing() {
    var ns = window[NS_KEY];
    if (!ns) return required.slice();
    var out = [];
    for (var i = 0; i < required.length; i++) if (!ns[required[i]]) out.push(required[i]);
    return out;
  }
  (function poll() {
    var gaps = missing();
    if (gaps.length === 0) return done(window[NS_KEY]);
    if (elapsed() > REFETCH_AT && !refetched) {
      refetched = true;
      var base = document.querySelector('script[src$="_ds_bundle.js"]');
      var s = document.createElement("script");
      s.src = (base ? base.getAttribute("src") : "_ds_bundle.js") + "?cb=" + Date.now();
      document.head.appendChild(s);
    }
    if (elapsed() > DEADLINE) {
      var root = document.getElementById("root");
      if (root) root.innerHTML = '<div role="alert" style="max-width:62ch;margin:48px auto;padding:20px 24px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#3f3f46"><strong style="display:block;margin-bottom:6px;color:#18181b">This kit could not load the design system</strong>' + (!window[NS_KEY] ? '<code>_ds_bundle.js</code> did not load. It is regenerated whenever components change \u2014 reload in a moment.' : 'The loaded bundle is missing: <code>' + gaps.join(", ") + '</code>. Hard reload to clear the cached copy.') + '</div>';
      return;
    }
    setTimeout(poll, TICK);
  })();
}

dsReady(["Navbar","Button","Card","Badge","Tag","Quote","Accordion","Prose","Callout","Cover","Image","Video","Avatar","Stat","Inline","Stack","Divider"], function (NS) {
  ({ Navbar, Button, Card, Badge, Tag, Quote, Accordion, Prose, Callout, Cover, Image, Video, Avatar, Stat, Inline, Stack, Divider } = NS);
  window.DT_ASSETS.then(function () {
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  });
});
</script>
