function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <Stack gap="sm">
      <Alert tone="info" title="Sync is paused">Reconnect your workspace to resume syncing.</Alert>
      <Alert tone="success" onDismiss={() => {}}>Your changes are saved.</Alert>
      <Alert tone="warning" title="Trial ends in 3 days" action={<Button size="sm" variant="secondary">Add a card</Button>} />
      <Alert tone="danger" title="We couldn't save your changes">Your session expired. Sign in again and retry.</Alert>
      <Inline gap="xs"><Button variant="danger" onClick={() => setOpen(true)}>Delete project</Button></Inline>
      <Dialog open={open} onClose={() => setOpen(false)} title="Delete this project?"
        description="This removes all 42 documents inside it. You can't undo this."
        footer={<React.Fragment>
          <Button variant="secondary" onClick={() => setOpen(false)}>Cancel</Button>
          <Button variant="danger" onClick={() => setOpen(false)}>Delete project</Button>
        </React.Fragment>} />
    </Stack>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
