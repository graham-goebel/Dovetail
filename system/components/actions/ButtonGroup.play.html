<!-- @dsCard group="Playground" viewport="1280x820" name="ButtonGroup" subtitle="Spaced and attached groups, with the accessible-name contract" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ButtonGroup — playground</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>html,body{margin:0;height:100%}body{background:#fff;font-family:var(--dt-font-family-sans,system-ui,sans-serif)}#root{height:100%}a{color:var(--dt-text-action)}a:hover{color:var(--dt-text-action-hover,var(--dt-text-action))}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.DT_PLAYGROUND = "ButtonGroup";</script>
<script>
/* Token-propagating asset loader.

   The page URL carries an auth token. Project-relative subresource URLs do not inherit
   it and come back 401, so every request below is built with the token appended. An
   absent token yields an empty suffix, so this is correct either way.

   Two things need more than a rewritten URL:

   CSS is fetched and its @import closure resolved here, then injected as one <style>.
   A <link> would load, but the imports inside it resolve against the stylesheet URL
   without the token and 401 silently — the sheet arrives with rules and none of the
   tokens they pull in.

   Babel-typed files are fetched and transformed here rather than left to Babel's scan,
   because Babel fetches src itself and a 401 surfaces as a bare "Script error." with no
   URL attached. */
(function () {
  var Q = (function () {
    var t = new URLSearchParams(location.search).get("t");
    return t ? "?t=" + t : "";
  })();
  var B = "../../";
  var failures = [];
  window.DT_ASSET_FAILURES = failures;

  function url(p) { return B + p + Q; }

  function normalise(p) {
    var out = [];
    p.split("/").forEach(function (seg) {
      if (seg === "." || seg === "") return;
      if (seg === "..") out.pop(); else out.push(seg);
    });
    return out.join("/");
  }

  function resolveCss(path) {
    return fetch(url(path))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) {
        var dir = path.replace(/[^/]*$/, "");
        var re = /@import\s+(?:url\()?["']?([^"')]+)["']?\)?\s*;/g;
        var parts = [], jobs = [], last = 0, m;
        while ((m = re.exec(txt))) {
          parts.push(txt.slice(last, m.index));
          last = m.index + m[0].length;
          if (/^(https?:)?\/\//.test(m[1])) { parts.push(m[0]); continue; }
          jobs.push({ slot: parts.length, path: normalise(dir + m[1]) });
          parts.push("");
        }
        parts.push(txt.slice(last));
        return Promise.all(jobs.map(function (j) {
          return resolveCss(j.path).then(function (css) { parts[j.slot] = css; });
        })).then(function () { return parts.join("\n"); });
      })
      .catch(function (e) { failures.push(path + " (" + e.message + ")"); return ""; });
  }

  function js(p) {
    return new Promise(function (res) {
      var s = document.createElement("script");
      s.src = url(p);
      s.onload = function () { res(true); };
      s.onerror = function () { failures.push(p); res(false); };
      document.head.appendChild(s);
    });
  }

  function jsx(p) {
    return fetch(url(p))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (src) { (0, eval)(Babel.transform(src, { presets: ["react"] }).code); return true; })
      .catch(function (e) { failures.push(p + " (" + e.message + ")"); return false; });
  }

  window.DT_ASSETS = Promise.all([
    resolveCss("styles.css")
  ])
    .then(function (sheets) {
      var el = document.createElement("style");
      el.id = "dt-inlined-css";
      el.textContent = sheets.join("\n");
      document.head.appendChild(el);
    })
    .then(function () { return js("_ds_bundle.js"); })
    .then(function () { return jsx("templates/_support/playground-specs.js"); })
    .then(function () { return jsx("templates/_support/playground.js"); })
    .then(function () { return failures; });

  window.DT_ASSETS.then(function (failed) {
    if (window.dtMountPlayground && window.DT_SPECS && window.DT_SPECS[window.DT_PLAYGROUND]) {
      try { return window.dtMountPlayground(); }
      catch (err) { return fail("The playground threw while mounting: <code>" + err.message + "</code>"); }
    }
    fail(failed.length
      ? "These did not load: <code>" + failed.join("</code>, <code>") + "</code>."
      : "No spec is registered for <code>" + window.DT_PLAYGROUND + "</code> in playground-specs.js.");
  });

  function fail(why) {
    var el = document.getElementById("root");
    if (!el) return;
    el.innerHTML = '<div role="alert" style="max-width:64ch;margin:48px auto;padding:20px 24px;' +
      'border:1px solid #d4d4d8;border-radius:8px;background:#fff;' +
      'font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#3f3f46">' +
      '<strong style="display:block;margin-bottom:6px;color:#18181b">Playground could not start</strong>' +
      why + '</div>';
  }
})();
</script>
</head><body><div id="root"></div>
</body></html>
