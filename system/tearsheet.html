<script type="text/babel">
const NS = window.BeamMobileDesignSystem_e33121 || {};
const { Button, ButtonGroup, IconButton, Link, Badge, Card, Tag, Alert, Dialog, Checkbox, Field, Input, Radio, Select, Switch, Textarea, Divider, Grid, Inline, Stack, VisuallyHidden, AspectRatio, Image, Figure, Media } = NS;

const IconSearch = <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
const IconEdit = <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
const IconAdd = <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;

const CATS = [
  { id: "primitives", label: "Primitives" },
  { id: "components", label: "Components" },
  { id: "tokens", label: "Tokens" },
  { id: "styles", label: "Styles" },
  { id: "templates", label: "Templates" },
];

function FilterBar({ active, onToggle, total, shown, theme, onTheme }) {
  return (
    <div className="filterbar">
      <button className="chip" data-active={active.size === CATS.length} onClick={() => onToggle("__all")}>All</button>
      {CATS.map(c => (
        <button key={c.id} className="chip" data-active={active.has(c.id)} onClick={() => onToggle(c.id)}>{c.label}</button>

      <span className="count">{shown} / {total} sections</span>
      <select className="themeselect" value={theme} onChange={e => onTheme(e.target.value)}>
        <option value="light">Base — Light</option>
        <option value="dark">Base — Dark</option>
        <option value="editorial">Editorial</option>
        <option value="mono">Mono</option>
      </select>
    </div>
  );
}

function GroupHeader({ show, children }) {
  if (!show) return null;
  return <h3 className="grouphead">{children}</h3>;
}

function Section({ id, cat, title, children, active }) {
  if (!active.has(cat)) return null;
  return <section data-cat={cat} id={id}><h2>{title}</h2>{children}</section>;
}

      } else {
        next.add(id);
      }
      return next;

    let link = document.getElementById("theme-override");
    if (theme === "editorial" || theme === "mono") {
      if (!link) {
        link = document.createElement("link");
        link.id = "theme-override";
        link.rel = "stylesheet";
        document.head.appendChild(link);

      link.href = THEME_FILES[theme];
    } else if (link) {
      link.remove();

                    <div style={{width:24,height:16,background:"var(--dt-surface-action)",borderRadius:"var(--dt-radius-control)"}} />

              </Stack>

                    </Grid>

                  <VisuallyHidden>Notifications, </VisuallyHidden>3 unread
                </Button>

        <GroupHeader show={allShown}>Components</GroupHeader>
        <Section cat="components" title="Actions — Button, IconButton, ButtonGroup, Link" active={active}>
          <div className="panel">

              <Inline gap="xs" wrap>

                <Button variant="secondary">Cancel</Button>

                <Button size="sm">Small</Button>

        <Section cat="components" title="Forms — Field, Input, Textarea, Select, Checkbox, Radio, Switch" active={active}>
          <div className="panel">
            <Stack gap="lg">
              <div className="grid3">
                <Input label="Rest" placeholder="you@company.com" />

        </Section>

        <Section cat="components" title="Display — Card, Badge, Tag" active={active}>
          <div className="panel">
            <Stack gap="lg">
              <div className="grid3">
                <Card eyebrow="Rest" title="Static card" description="Elevation 0, border only." />

              </div>

        <Section cat="components" title="Feedback — Alert, Dialog" active={active}>

              <Stack gap="xs">
                <Alert tone="info" title="Scheduled maintenance">Dovetail will be read-only on Saturday from 02:00 to 04:00 UTC.</Alert>
                <Alert tone="success" title="Theme published" onDismiss={() => {}}>Your token overrides are live for every consumer of the package.</Alert>
                <Alert tone="warning" title="Two tokens are deprecated" action={<Button variant="secondary" size="sm">View report</Button>}>Replace them before the next major release.</Alert>
                <Alert tone="danger" title="Build failed">Three semantic pairs fall below 4.5:1 in dark mode.</Alert>
              </Stack>
              <div style={{position:"relative",minHeight:320,border:"var(--dt-border-width-hair) dashed var(--dt-border-subtle)",borderRadius:"var(--dt-radius-container)",overflow:"hidden",background:"var(--dt-surface-sunken)",contain:"layout",transform:"scale(1)"}}>

              </div>
            </Stack>

                  <div key={r} style={{width:100,height:64,background:"var(--dt-surface-sunken)",borderRadius:`var(--dt-radius-${r})`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"var(--dt-font-family-mono)",fontSize:11,color:"var(--dt-text-tertiary)"}}>{r}</div>
