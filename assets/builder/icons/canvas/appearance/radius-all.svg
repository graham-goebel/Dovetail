<svg xmlns="http://www.w3.org/2000/svg" class="ci cx-radius-all" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><style>@media(prefers-reduced-motion:reduce){.cx-radius-all *{animation:none!important}}.cx-radius-all .corner{animation:cx-radius var(--ci-duration,3.2s) ease-in-out 0s var(--ci-repeat,infinite)}@keyframes cx-radius{0%,12%,90%,100%{rx:1px}45%,60%{rx:6px}}</style><g class="cx-radius-all-p0"><rect class="corner" x="4" y="4" width="16" height="16" rx="1"/></g></svg>