<svg xmlns="http://www.w3.org/2000/svg" class="ci cx-blend" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><style>.cx-blend .cx-blend-p0{transform-box:view-box;transform-origin:12px 12px;animation:cx-blend-p0 var(--ci-duration,3.2s) cubic-bezier(.4,0,.2,1) 0s var(--ci-repeat,infinite)}@keyframes cx-blend-p0{0%,12%,90%,100%{transform:none;opacity:1}45%,60%{transform:translate(2px,0px)}}.cx-blend .cx-blend-p1{transform-box:view-box;transform-origin:12px 12px;animation:cx-blend-p1 var(--ci-duration,3.2s) cubic-bezier(.4,0,.2,1) 0s var(--ci-repeat,infinite)}@keyframes cx-blend-p1{0%,12%,90%,100%{transform:none;opacity:1}45%,60%{transform:translate(-2px,0px)}}@media(prefers-reduced-motion:reduce){.cx-blend *{animation:none!important}}</style><g class="cx-blend-p0"><circle cx="9" cy="12" r="6"/></g><g class="cx-blend-p1"><circle cx="15" cy="12" r="6"/></g></svg>