<svg xmlns="http://www.w3.org/2000/svg" class="ci cx-overflow-hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><style>.cx-overflow-hidden .cx-overflow-hidden-p1{transform-box:view-box;transform-origin:12px 12px;animation:cx-overflow-hidden-p1 var(--ci-duration,3.2s) cubic-bezier(.4,0,.2,1) 0s var(--ci-repeat,infinite)}@keyframes cx-overflow-hidden-p1{0%,12%,90%,100%{transform:none;opacity:1}45%,60%{transform:translate(0px,2px)}}@media(prefers-reduced-motion:reduce){.cx-overflow-hidden *{animation:none!important}}</style><g class="cx-overflow-hidden-p0"><rect x="4" y="4" width="16" height="16" rx="1"/></g><g class="cx-overflow-hidden-p1"><rect x="8" y="8" width="8" height="8" rx="1"/></g></svg>