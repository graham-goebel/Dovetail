<svg xmlns="http://www.w3.org/2000/svg" class="ci layers" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><style>.layers .motion{transform-box:view-box;transform-origin:12px 12px}.layers .top{animation:layersa var(--ci-duration,2.8s) ease-in-out var(--ci-repeat,infinite)}.layers .bottom{animation:layersb var(--ci-duration,2.8s) ease-in-out var(--ci-repeat,infinite)}@keyframes layersa{0%,20%,90%,100%{transform:translateY(0)}45%,60%{transform:translateY(-2px)}}@keyframes layersb{0%,20%,90%,100%{transform:translateY(0)}45%,60%{transform:translateY(2px)}}@media(prefers-reduced-motion:reduce){.layers *{animation:none!important}}</style><g class="top"><path d="m12 3 10 5-10 5L2 8Z"/></g><path d="M2 12l10 5 10-5"/><g class="bottom"><path d="M2 16l10 5 10-5"/></g></svg>