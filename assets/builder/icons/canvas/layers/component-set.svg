<svg xmlns="http://www.w3.org/2000/svg" class="ci component-set" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><style>.component-set .motion{transform-box:view-box;transform-origin:12px 12px}.component-set .part{transform-box:view-box;transform-origin:12px 12px;animation:component_set var(--ci-duration,2.8s) ease-in-out var(--ci-repeat,infinite)}.component-set .p1{animation-delay:.08s}.component-set .p2{animation-delay:.16s}.component-set .p3{animation-delay:.24s}@keyframes component_set{0%,15%,85%,100%{transform:scale(1);opacity:1}45%,55%{transform:scale(.67);opacity:.45}}@media(prefers-reduced-motion:reduce){.component-set *{animation:none!important}}</style><g class="part p0"><path d="m12 2 4 4-4 4-4-4Z"/></g><g class="part p1"><path d="m6 8 4 4-4 4-4-4Z"/></g><g class="part p2"><path d="m18 8 4 4-4 4-4-4Z"/></g><g class="part p3"><path d="m12 14 4 4-4 4-4-4Z"/></g></svg>